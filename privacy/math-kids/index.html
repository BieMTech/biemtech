      /* ================================================================
   RENDER
   ================================================================ */
      function li(items) {
        return items.map((i) => `<li>${i}</li>`).join("");
      }

      function render(lang) {
        const t = T[lang];
        const doc = document.documentElement;
        doc.lang = lang;
        doc.dir = t.dir;

        // Update subtitle
        document.querySelector('[data-i18n="subtitle"]').textContent =
          t.subtitle;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.querySelector('[data-i18n="effective"]').textContent =
          t.effective;
        document.querySelector(".lang-bar label").innerHTML = t.lang_label;
        document.querySelector(".back-link").innerHTML = t.back_text;

        document.getElementById("main-content").innerHTML = `
    <p class="meta">
      ${t.meta_app}: <strong>Math Kids</strong> &nbsp;|&nbsp;
      ${t.meta_pkg}: <code>com.biemtech.mathkids</code> &nbsp;|&nbsp;
      ${t.meta_date}: <strong>${t.meta_date_val}</strong>
    </p>

    <div class="highlight">&#x2705; ${t.highlight}</div>

    <section class="card">
      <h2>${t.s1_title}</h2>
      <p>${t.s1}</p>
    </section>

    <section class="card">
      <h2>${t.s2_title}</h2>
      <p>${t.s2_p1}</p>
      <ul>${li(t.s2_li)}</ul>
      <p>${t.s2_p2}</p>
    </section>

    <section class="card">
      <h2>${t.s3_title}</h2>
      <p>${t.s3_p1}</p>
      <ul>${li(t.s3_li)}</ul>
    </section>

    <section class="card">
      <h2>${t.s4_title}</h2>
      ${t.s4}
    </section>

    <section class="card">
      <h2>${t.s5_title}</h2>
      <p>${t.s5_p1}</p>
      <ul>${li(t.s5_li)}</ul>
    </section>

    <section class="card">
      <h2>${t.s6_title}</h2>
      <p>${t.s6_p1}</p>
      <ul>${li(t.s6_li)}</ul>
      <p>${t.s6_p2}</p>
    </section>

    <section class="card">
      <h2>${t.s7_title}</h2>
      <p>${t.s7_p1}</p>
      <ul>${li(t.s7_li)}</ul>
      <p>${t.s7_p2}</p>

      <p>&#128231; <strong>${t.s9_email}:</strong> <a href="mailto:mathkids@biemtech.com">mathkids@biemtech.com</a></p>

    </section>
  `;
      }

      function switchLang(lang) {
        render(lang);
        try {
          localStorage.setItem("pp_lang", lang);
        } catch (e) {}
      }

      // Init: use saved language or browser default
      (function () {
        let saved = null;
        try {
          saved = localStorage.getItem("pp_lang");
        } catch (e) {}
        const browserLang = (navigator.language || "en")
          .slice(0, 2)
          .toLowerCase();
        const lang =
          saved && T[saved] ? saved : T[browserLang] ? browserLang : "en";
        document.getElementById("lang-select").value = lang;
        render(lang);
      })();
    </script>
