<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policies — BieMTech</title>
    <meta
      name="description"
      content="Privacy policies for BieMTech mobile apps."
    />
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
    <style>
      /* â”€â”€â”€ Variables â”€â”€â”€ */
      :root {
        --primary: #2e6f40;
        --accent: #b56e47;
        --bg: #ede6d4;
        --bg-card: rgba(237, 226, 205, 0.92);
        --text: #1a1a14;
        --text-muted: #4a4236;
        --text-dim: #7a7060;
        --border: rgba(0, 0, 0, 0.09);
      }

      /* â”€â”€â”€ Reset â”€â”€â”€ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* â”€â”€â”€ Scrollbar â”€â”€â”€ */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.04);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(46, 111, 64, 0.35);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(46, 111, 64, 0.6);
      }

      /* â”€â”€â”€ Keyframes â”€â”€â”€ */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* â”€â”€â”€ Body â”€â”€â”€ */
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* â”€â”€â”€ Header â”€â”€â”€ */
      header {
        background: rgba(237, 230, 212, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        padding: 48px 24px 38px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        color: var(--text-muted);
        text-decoration: none;
        margin-bottom: 22px;
        letter-spacing: 0.04em;
        font-weight: 500;
        padding: 7px 18px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.5);
        transition: all 0.22s ease;
      }
      .home-link:hover {
        color: var(--text);
        border-color: rgba(46, 111, 64, 0.4);
        background: rgba(46, 111, 64, 0.06);
        box-shadow: 0 0 16px rgba(46, 111, 64, 0.15);
      }
      .home-link img {
        height: 20px;
        border-radius: 5px;
      }

      header h1 {
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(
          135deg,
          #1f5230 0%,
          #2e6f40 50%,
          #b56e47 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      header p {
        margin-top: 10px;
        font-size: 0.88rem;
        color: var(--text-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
      }

      /* â”€â”€â”€ Main â”€â”€â”€ */
      main {
        flex: 1;
        max-width: 680px;
        width: 100%;
        margin: 48px auto;
        padding: 0 20px;
        position: relative;
        z-index: 1;
      }

      .section-label {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 16px;
      }

      /* â”€â”€â”€ App list â”€â”€â”€ */
      .app-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .app-list a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 22px;
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
        font-size: 0.97rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow:
          0 4px 20px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        transition:
          transform 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease;
        animation: fadeUp 0.45s ease both;
      }
      .app-list a:hover {
        border-color: rgba(46, 111, 64, 0.35);
        background: rgba(46, 111, 64, 0.06);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.6),
          0 0 0 1px rgba(46, 111, 64, 0.2);
        transform: translateY(-2px);
      }
      .app-list a .arrow {
        color: var(--primary);
        font-size: 1.1rem;
        transition: transform 0.22s ease;
      }
      .app-list a:hover .arrow {
        transform: translateX(3px);
      }

      /* â”€â”€â”€ Footer â”€â”€â”€ */
      footer {
        text-align: center;
        padding: 26px;
        font-size: 0.82rem;
        color: var(--text-dim);
        border-top: 1px solid var(--border);
        position: relative;
        z-index: 1;
      }
      footer a {
        color: var(--primary);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--accent);
      }

      /* ── Language switcher ── */
      .page-header-top {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 16px;
      }
      .lang-select {
        appearance: none;
        -webkit-appearance: none;
        background: rgba(46, 111, 64, 0.08);
        border: 1px solid rgba(46, 111, 64, 0.28);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 10px;
        transition: all 0.2s ease;
        outline: none;
        font-family: inherit;
      }
      .lang-select:hover {
        background: rgba(46, 111, 64, 0.14);
        border-color: rgba(46, 111, 64, 0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="page-header-top">
        <select
          id="lang-select"
          class="lang-select"
          onchange="setLang(this.value)"
          aria-label="Language"
        >
          <option value="en">🇬🇧 EN</option>
          <option value="az">🇦🇿 AZ</option>
          <option value="ru">🇷🇺 RU</option>
          <option value="tr">🇹🇷 TR</option>
          <option value="de">🇩🇪 DE</option>
          <option value="fr">🇫🇷 FR</option>
          <option value="es">🇪🇸 ES</option>
          <option value="pt">🇵🇹 PT</option>
          <option value="it">🇮🇹 IT</option>
          <option value="ar">🇸🇦 AR</option>
          <option value="zh">🇨🇳 ZH</option>
          <option value="ja">🇯🇵 JA</option>
        </select>
      </div>
      <a href="../index.html" class="home-link">
        <img src="../img/logo-biemtech.png" alt="BieMTech" />
        BieMTech
      </a>
      <h1 data-i18n="priv_title">Privacy Policies</h1>
      <p data-i18n="priv_sub">Select an app to view its privacy policy.</p>
    </header>

    <main>
      <p class="section-label" data-i18n="priv_label">Apps</p>
      <ul class="app-list">
        <!-- Add one <li> per app -->
        <li>
          <a href="./math-kids/index.html">
            Math Kids
            <span class="arrow">&#8594;</span>
          </a>
        </li>
        <li>
          <a href="./times-table-master/index.html">
            Times Table Master
            <span class="arrow">&#8594;</span>
          </a>
        </li>
        <li>
          <a href="./arrows-escape/index.html">
            Arrows Escape
            <span class="arrow">&#8594;</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      &copy; <span id="yr"></span> <a href="../index.html">BieMTech</a>. All
      rights reserved.
    </footer>

    <script>
      document.getElementById("yr").textContent = new Date().getFullYear();
    </script>
    <script src="../i18n.js"></script>
  </body>
</html>
