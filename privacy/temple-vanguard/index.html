            ["6. Kinder und allgemeines Publikum", "<p>Die App bietet keine Registrierung, Chats, sozialen Profile, Nutzerinhalte, Verhaltensprofile oder zielgerichtete Werbung. Derselbe Datenschutz gilt für alle Spieler. Wir erfassen wissentlich keine personenbezogenen Daten von Kindern oder Erwachsenen.</p>"],
            ["7. Aufbewahrung, Löschung und Änderungen", "<p>Lokaler Fortschritt und Einstellungen bleiben bis zur Löschung auf dem Gerät. Alle lokalen Daten lassen sich durch Löschen des Temple-Vanguard-Speichers in Android oder durch Deinstallation entfernen. Da keine Daten an Server gesendet werden, ist kein serverseitiger Löschantrag nötig.</p><p>Ändern sich App oder Datenpraxis, aktualisieren wir diese Erklärung und ihr Datum vor der Verteilung der betreffenden Version.</p>"],
            ["8. Kontakt", "<p>Bei Fragen zu dieser Erklärung oder der Datenpraxis von Temple Vanguard kontaktieren Sie BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]

        fr: {
          dir: "ltr", back: "← Politiques de confidentialité BieMTech", subtitle: "Politique de confidentialité", audience: "Version Android actuelle en prépublication · Grand public", rights: "Tous droits réservés.", app: "Application", pkg: "Package", updated: "Dernière mise à jour", date: "15 septembre 2026",
          summary: "<strong>En bref :</strong> Temple Vanguard <strong>ne collecte, ne partage, ne vend et ne transmet aucune donnée personnelle</strong>. La version actuelle fonctionne entièrement hors ligne, sans publicité ni analyse, et conserve progression et réglages uniquement sur votre appareil.",
          sections: [
            ["1. À propos de l'application", "<p>Temple Vanguard est un runner 3D vertical en escouade créé par BieMTech. Le joueur guide un commandant de pierre à travers des portes arithmétiques et les dangers du temple avant un combat d'arène automatique stylisé. L'application est en développement.</p>"],
            ["2. Informations collectées", "<p>Temple Vanguard <strong>ne collecte aucune donnée personnelle</strong>. Aucun nom, e-mail, téléphone, compte, connexion, position précise, contact, photo, média, microphone ou caméra n'est demandé. Aucune donnée de jeu ou d'appareil n'est envoyée à BieMTech ou à des tiers.</p><p>Il n'existe ni profil serveur ni compte distant.</p>"],
            ["3. Données sur votre appareil", "<p>Seuls la progression et les préférences locales sont enregistrées : plus haut niveau débloqué, meilleurs effectifs, étoiles, son, vibration et langue choisie. Ces données restent dans l'espace privé de l'application et servent uniquement à reprendre le jeu.</p>"],
            ["4. Utilisation hors ligne et autorisations", "<p>La version Android actuelle fonctionne entièrement hors ligne et ne déclare ni accès Internet ni autorisation personnalisée. Le retour haptique facultatif peut utiliser la vibration lorsqu'il est activé. Aucune autorisation sensible n'est demandée.</p>"],
            ["5. Publicité et tiers", "<p>Temple Vanguard ne contient ni publicité, analyse, suivi, achat intégré, sauvegarde cloud, fonction sociale, ni SDK tiers à ces fins. La boutique ou plateforme peut traiter ses propres données selon sa politique ; ce traitement est distinct de Temple Vanguard.</p>"],
            ["6. Enfants et grand public", "<p>L'application ne propose ni inscription, chat, profil social, contenu utilisateur, profilage comportemental ou publicité ciblée. Les mêmes protections s'appliquent à tous. Nous ne collectons sciemment aucune donnée personnelle d'enfant ou d'adulte.</p>"],
            ["7. Conservation, suppression et changements", "<p>Progression et réglages restent sur l'appareil jusqu'à leur suppression. Effacez toutes les données locales via le stockage de Temple Vanguard dans Android ou en désinstallant l'application. Aucune demande au serveur n'est nécessaire puisqu'aucune donnée ne lui est envoyée.</p><p>Si l'application ou ses pratiques changent, nous mettrons à jour cette politique et sa date avant la diffusion de la version concernée.</p>"],
            ["8. Nous contacter", "<p>Pour toute question sur cette politique ou les pratiques de Temple Vanguard, contactez BieMTech :</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        es: {
          dir: "ltr", back: "← Políticas de privacidad de BieMTech", subtitle: "Política de privacidad", audience: "Versión preliminar actual para Android · Público general", rights: "Todos los derechos reservados.", app: "Aplicación", pkg: "Paquete", updated: "Última actualización", date: "15 de septiembre de 2026",
          summary: "<strong>En resumen:</strong> Temple Vanguard <strong>no recopila, comparte, vende ni transmite datos personales</strong>. La versión actual funciona totalmente sin conexión, no incluye anuncios ni análisis y guarda el progreso y los ajustes solo en tu dispositivo.",
          sections: [
            ["1. Sobre la aplicación", "<p>Temple Vanguard es un runner 3D vertical de escuadrones creado por BieMTech. El jugador guía a un comandante de piedra por puertas aritméticas y peligros del templo antes de una batalla automática estilizada en la arena. La aplicación está en desarrollo.</p>"],
            ["2. Información que recopilamos", "<p>Temple Vanguard <strong>no recopila información personal</strong>. No solicita nombre, correo, teléfono, cuenta, inicio de sesión, ubicación precisa, contactos, fotos, contenido multimedia, micrófono ni cámara. Los datos del juego o del dispositivo no se envían a BieMTech ni a terceros.</p><p>No hay perfil de servidor ni cuenta remota.</p>"],
            ["3. Datos guardados en tu dispositivo", "<p>Solo se guardan el progreso y las preferencias locales: nivel máximo desbloqueado, mejores tamaños del escuadrón, estrellas, sonido, vibración e idioma. Estos datos permanecen en el almacenamiento privado de la aplicación y solo sirven para continuar la experiencia.</p>"],
            ["4. Uso sin conexión y permisos", "<p>La versión actual de Android funciona totalmente sin conexión y no declara acceso a Internet ni permisos personalizados. La respuesta háptica opcional puede usar la vibración del dispositivo cuando está activada. No se solicitan permisos sensibles.</p>"],
            ["5. Anuncios y terceros", "<p>Temple Vanguard no contiene anuncios, análisis, seguimiento, compras integradas, guardado en la nube, funciones sociales ni SDK de terceros para esos fines. La tienda o plataforma puede tratar sus propios datos según su política; ese tratamiento es independiente de Temple Vanguard.</p>"],
            ["6. Niños y público general", "<p>La aplicación no tiene registro, chat, perfil social, contenido de usuario, perfilado de conducta ni publicidad dirigida. La misma protección se aplica a todos. No recopilamos conscientemente información personal de niños ni adultos.</p>"],
            ["7. Conservación, eliminación y cambios", "<p>El progreso y los ajustes locales permanecen hasta que los elimines. Puedes borrar todos los datos limpiando el almacenamiento de Temple Vanguard en Android o desinstalando la aplicación. Como no se envían datos a servidores, no hace falta una solicitud de eliminación.</p><p>Si cambian la aplicación o sus prácticas, actualizaremos esta política y su fecha antes de distribuir la versión correspondiente.</p>"],
            ["8. Contacto", "<p>Para preguntas sobre esta política o las prácticas de Temple Vanguard, contacta con BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },

            ["7. Retenção, eliminação e alterações", "<p>O progresso e as definições locais ficam no dispositivo até serem eliminados. Pode apagar tudo limpando o armazenamento de Temple Vanguard no Android ou desinstalando a aplicação. Como nenhum dado é enviado para servidores, não é necessário um pedido de eliminação.</p><p>Se a aplicação ou as suas práticas mudarem, atualizaremos esta política e a data antes de distribuir a versão relevante.</p>"],
            ["8. Contacte-nos", "<p>Para questões sobre esta política ou as práticas de Temple Vanguard, contacte a BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },

          sections: [

            ["8. Contatti", "<p>Per domande su questa informativa o sulle pratiche di Temple Vanguard, contatta BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },

          summary: "<strong>باختصار:</strong> لا تقوم Temple Vanguard <strong>بجمع البيانات الشخصية أو مشاركتها أو بيعها أو إرسالها</strong>. يعمل الإصدار الحالي بالكامل دون اتصال، ولا يحتوي إعلانات أو تحليلات، ويحفظ التقدم والإعدادات على جهازك فقط.",
          sections: [
            ["1. حول التطبيق", "<p>Temple Vanguard لعبة ركض عمودية ثلاثية الأبعاد بفرق من BieMTech. يقود اللاعب قائداً حجرياً عبر بوابات الحساب ومخاطر المعبد، ثم يدخل معركة ساحة تلقائية بأسلوب خيالي. التطبيق قيد التطوير.</p>"],
            ["2. المعلومات التي نجمعها", "<p>لا تجمع Temple Vanguard <strong>أي معلومات شخصية</strong>. لا تطلب الاسم أو البريد أو الهاتف أو الحساب أو تسجيل الدخول أو الموقع الدقيق أو جهات الاتصال أو الصور أو الوسائط أو الميكروفون أو الكاميرا. ولا تُرسل بيانات اللعبة أو الجهاز إلى BieMTech أو أطراف ثالثة.</p><p>لا يوجد ملف على خادم أو حساب بعيد.</p>"],
            ["3. البيانات المحفوظة على جهازك", "<p>يُحفظ محلياً فقط أعلى مستوى مفتوح وأفضل أعداد الفرقة وتقييمات النجوم وإعدادات الصوت والاهتزاز واللغة. تبقى هذه البيانات في مساحة التطبيق الخاصة وتُستخدم فقط لمتابعة اللعب.</p>"],
            ["4. الاستخدام دون اتصال والأذونات", "<p>يعمل إصدار Android الحالي بالكامل دون اتصال ولا يعلن إذن الإنترنت أو أذونات مخصصة. وقد يستخدم الاهتزاز الاختياري وظيفة اهتزاز الجهاز عند تفعيله. لا يطلب التطبيق أذونات حساسة.</p>"],
            ["5. الإعلانات والأطراف الثالثة", "<p>لا تحتوي Temple Vanguard على إعلانات أو تحليلات أو تتبع أو مشتريات داخلية أو حفظ سحابي أو ميزات اجتماعية أو حزم أطراف ثالثة لهذه الأغراض. قد يعالج المتجر أو النظام بياناته الخاصة وفق سياسته؛ وهذا منفصل عن Temple Vanguard.</p>"],
            ["6. الأطفال والجمهور العام", "<p>لا يوجد تسجيل أو دردشة أو ملف اجتماعي أو محتوى مستخدم أو تنميط سلوكي أو إعلانات موجهة. تنطبق الحماية نفسها على الجميع. نحن لا نجمع عن علم معلومات شخصية من الأطفال أو البالغين.</p>"],
            ["7. الاحتفاظ والحذف والتغييرات", "<p>يبقى التقدم والإعدادات محلياً حتى تحذفها. يمكنك حذف كل البيانات بمسح تخزين Temple Vanguard من إعدادات Android أو بإزالة التطبيق. ولأنه لا تُرسل بيانات إلى خادم فلا حاجة إلى طلب حذف من الخادم.</p><p>إذا تغير التطبيق أو ممارسات البيانات فسنحدث هذه السياسة وتاريخها قبل توزيع الإصدار المعني.</p>"],

        zh: {
          dir: "ltr", back: "← BieMTech 隐私政策", subtitle: "隐私政策", audience: "当前 Android 预发布版本 · 普通受众", rights: "保留所有权利。", app: "应用", pkg: "软件包", updated: "最后更新", date: "2026年9月15日",
          summary: "<strong>简而言之：</strong>Temple Vanguard <strong>不会收集、共享、出售或传输个人数据</strong>。当前版本完全离线运行，不含广告或分析，只在你的设备上保存进度和设置。",
          sections: [
            ["1. 关于应用", "<p>Temple Vanguard 是 BieMTech 开发的竖屏3D小队跑酷游戏。玩家操控石甲指挥官穿过算术门和神殿机关，随后进入风格化的自动竞技场战斗。应用目前正在开发中。</p>"],
            ["2. 我们收集的信息", "<p>Temple Vanguard <strong>不收集个人信息</strong>。应用不会请求姓名、邮箱、电话、账户、登录、精确位置、联系人、照片、媒体、麦克风或相机权限。游戏或设备数据不会发送给 BieMTech 或第三方。</p><p>应用没有服务器端资料或远程账户。</p>"],
            ["3. 保存在设备上的数据", "<p>应用只保存本地进度和偏好：最高已解锁关卡、最佳小队数量、星级、声音、振动和所选语言。这些数据位于应用的私有存储中，只用于继续游戏体验。</p>"],
            ["4. 离线使用和权限", "<p>当前 Android 版本完全离线运行，不声明互联网或自定义权限。启用可选触觉反馈时，可能使用设备振动功能。Temple Vanguard 不请求敏感权限。</p>"],
            ["5. 广告和第三方", "<p>Temple Vanguard 不含广告、分析、跟踪、应用内购买、云存档、社交功能，也不含用于这些目的的第三方 SDK。获取应用的商店或平台可能按其政策处理自己的数据；该处理独立于 Temple Vanguard。</p>"],
            ["6. 儿童和普通受众", "<p>应用没有注册、聊天、社交资料、用户内容、行为画像或定向广告。相同的隐私保护适用于每位玩家。我们不会故意收集儿童或成人的个人信息。</p>"],
            ["7. 保留、删除和变更", "<p>本地进度和设置会留在设备上，直到你删除。你可以在 Android 设置中清除 Temple Vanguard 的存储或卸载应用，以删除所有本地数据。由于应用不向服务器发送数据，无需服务器端删除请求。</p><p>如果应用或数据做法发生变化，我们会在相关版本发布前更新本政策及日期。</p>"],
            ["8. 联系我们", "<p>如对本政策或 Temple Vanguard 的数据做法有疑问，请联系 BieMTech：</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },

            ["3. 端末に保存されるデータ", "<p>最高到達レベル、部隊のベスト人数、星評価、サウンド、振動、選択言語だけがローカル保存されます。データはアプリの非公開領域に置かれ、ゲームを再開するためだけに使われます。</p>"],
            ["4. オフライン利用と権限", "<p>現在のAndroid版は完全オフラインで動作し、インターネットやカスタム権限を宣言していません。任意の触覚フィードバックを有効にすると端末の振動機能を使う場合があります。機密性の高い権限は要求しません。</p>"],
            ["5. 広告と第三者", "<p>Temple Vanguardには広告、解析、追跡、アプリ内購入、クラウド保存、ソーシャル機能、またはそのための第三者SDKはありません。入手元のストアやプラットフォームが自身のポリシーでデータを処理する場合がありますが、Temple Vanguardとは別です。</p>"],
            ["6. 子どもと一般利用者", "<p>登録、チャット、ソーシャルプロフィール、ユーザー投稿、行動プロファイリング、ターゲット広告はありません。同じプライバシー保護が全プレイヤーに適用されます。子どもまたは大人の個人情報を意図的に収集しません。</p>"],
            ["7. 保持、削除、変更", "<p>ローカルの進行状況と設定は削除するまで端末に残ります。Android設定でTemple Vanguardのストレージを消去するか、アプリをアンインストールすると、すべて削除できます。サーバーへ送信しないため、サーバー側の削除依頼は不要です。</p><p>アプリやデータ取扱いが変わる場合、該当バージョンの配布前に本ポリシーと日付を更新します。</p>"],
            ["8. お問い合わせ", "<p>本ポリシーまたはTemple Vanguardのデータ取扱いについては、BieMTechへお問い合わせください。</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        }
      };

      function render(lang) {
        const t = T[lang] || T.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent = t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent = t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.getElementById("policy-content").innerHTML = `
          <p class="meta">
            ${t.app}: <strong>Temple Vanguard</strong> &nbsp;|&nbsp;
            ${t.pkg}: <code>com.biemtech.templevanguard</code> &nbsp;|&nbsp;
            ${t.updated}: <strong>${t.date}</strong>
          </p>
          <div class="summary">✓ ${t.summary}</div>
          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }

      function switchLang(lang) {
        render(lang);
        try { localStorage.setItem("biemtech-lang", lang); } catch (_) {}
      }

      document.getElementById("year").textContent = new Date().getFullYear();
      let saved = "";
      try { saved = localStorage.getItem("biemtech-lang") || ""; } catch (_) {}
      const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const lang = T[saved] ? saved : T[browserLang] ? browserLang : "en";
      document.getElementById("lang-select").value = lang;
      render(lang);
    </script>
  </body>
</html>
