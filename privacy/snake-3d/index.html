    <script>
      const T = {
        en: {
          dir: "ltr", back: "← BieMTech Privacy Policies", subtitle: "Privacy Policy", audience: "For ages 13+", rights: "All rights reserved.", app: "Application", pkg: "Package", updated: "Last updated", date: "November 3, 2026",
          summary: "<strong>Short version:</strong> No account is required; game data stays on your device. Optional rewarded video ads from Google AdMob may use the advertising ID and device data. You can change your choices in Settings &gt; \"Privacy options\" where available.",
          sections: [
            ["1. About This App", "<p>Snake 3D (com.biemtech.snake3d) is a 3D arcade game for ages 13 and over. This policy applies to version 2.1.0 and later.</p><p>Apples, the in-game currency, are earned only by playing or watching optional videos. There are no in-app purchases or real-money transactions.</p>"],
            ["2. Information We Collect", "<p>No account or login is required. There is no chat, user-generated content, analytics SDK (including Firebase or Google Analytics), or crash-reporting SDK. Game settings, progress and statistics stay on your device and are never sent to BieMTech.</p><p>Google’s advertising SDK may collect and process data as described below. BieMTech receives only aggregated AdMob ad reports, no personal data, and does not sell personal data.</p>"],
            ["3. Advertising (Google AdMob)", "<p>The game offers only optional rewarded video ads that you choose to watch, for example to revive, double apples, get free in-game items, or try a shop item for one run. There are no banner or interstitial ads. Ads are served by Google AdMob (Google Mobile Ads SDK), with content limited to the \"T\" (Teen) rating. Ad requests are marked as not child-directed.</p><p>Google’s SDK may collect and process the advertising ID, IP address and approximate location derived from it, device and app information, ad interaction data, and diagnostics/performance data. Purposes include delivering and measuring ads, frequency capping, fraud prevention and security, and ad analytics. Data is encrypted in transit.</p><p>Personalized ads are shown only with consent where consent is required; otherwise Google may show non-personalized or limited ads.</p><p>Google’s privacy information: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>You can reset or delete the advertising ID in Android Settings &gt; Privacy &gt; Ads; wording varies by device.</p>"],
            ["4. Your Privacy Choices and Consent", "<p>In the EEA, UK and Switzerland, the app shows Google’s consent form (Google User Messaging Platform) before requesting ads. In certain US states, users see a notice allowing them to opt out of the \"sale\" or \"sharing\" of personal information.</p><p>You can change or withdraw your choices at any time in the game under Settings &gt; \"Privacy options\", shown where the law requires it.</p><p>Depending on applicable GDPR or US-state law, your rights may include access, deletion, objection, withdrawing consent, and opting out of sale or sharing. Requests about ad data go through Google’s tools; you can also email us at info@biemtech.com.</p>"],
            ["5. Children (13+)", "<p>Snake 3D is for ages 13 and over and is not directed at children under 13. We do not knowingly collect personal information from children under 13. A parent who believes their child has provided data can contact us at info@biemtech.com.</p>"],
            ["6. Internet Access and Permissions", "<p>The game is fully playable offline. Internet access is used only to load ads and the consent form; video buttons are hidden while offline.</p><p>Android permissions:</p><ul><li><code>INTERNET</code> and <code>ACCESS_NETWORK_STATE</code>, added by the Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> for the advertising ID.</li><li><code>VIBRATE</code> for optional haptic feedback.</li></ul><p>The app does not request location, camera, microphone, contacts, photos/media, storage, or notification permissions.</p>"],
            ["7. Sharing and Links to Google Play", "<p>Share buttons open Android’s system share sheet with a short text (a score, level, achievement name or game name) and a Google Play link. The link includes a referral tag (utm_source / utm_medium) so Google Play can report which share button brought a visit; it contains no personal data. You choose the app and recipient. Snake 3D does not access contacts and does not see what is sent.</p><p>\"More games\" and \"Rate us\" open Google Play pages, where Google Play’s own privacy policy applies.</p>"],
            ["8. Data Stored on Your Device", "<p>The following data is stored only on your device and is never sent to BieMTech:</p><ul><li>Options: sound, music, vibration, graphics quality and language.</li><li>Progress: best score, current level, apples (in-game currency), shop items owned and worn, and boosters.</li><li>Daily quest, daily gift calendar, achievements and daily-challenge status.</li><li>Statistics: games played, apples eaten, longest snake, best combo, play time, golden birds caught, levels completed, 3-star levels, challenges won, time-attack best and days played.</li><li>A small local marker that turns music off after an audio-related crash.</li></ul>"],
            ["9. Data Retention and Deletion", "<p>Local game data remains on your device until you clear the app’s storage in Android Settings or uninstall the app. BieMTech does not receive this local data. For access or deletion requests about advertising data processed by Google, use Google’s tools; you can also email us.</p>"],
            ["10. Changes to This Policy", "<p>We may update this policy when the app or its data practices change. Updates will appear on this page with a revised last-updated date.</p>"],
            ["11. Contact Us", "<p>For questions about this policy or Snake 3D data practices, contact BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        zh: {
          dir: "ltr", back: "← BieMTech 隐私政策", subtitle: "隐私政策", audience: "适合13岁及以上", rights: "保留所有权利。", app: "应用", pkg: "软件包", updated: "最后更新", date: "2026年11月3日",
          summary: "<strong>简要说明：</strong>无需账号；游戏数据保存在您的设备上。Google AdMob提供的可选激励视频广告可能使用广告ID和设备数据。您可在提供该选项的地区，通过设置 &gt;“隐私选项”更改选择。",
          sections: [
            ["1. 关于本应用", "<p>Snake 3D（com.biemtech.snake3d）是一款面向13岁及以上玩家的3D街机游戏。本政策适用于2.1.0及后续版本。</p><p>游戏货币“苹果”只能通过游玩或观看可选视频获得。没有应用内购买或真实货币交易。</p>"],
            ["2. 我们收集的信息", "<p>无需账号或登录。游戏没有聊天、用户生成内容、分析SDK（包括Firebase或Google Analytics）或崩溃报告SDK。游戏设置、进度和统计仅保存在设备上，绝不会发送给BieMTech。</p><p>Google广告SDK可能按下文所述收集和处理数据。BieMTech仅接收AdMob的汇总广告报告，不接收个人数据，也不出售个人数据。</p>"],
            ["3. 广告（Google AdMob）", "<p>游戏仅提供由您主动选择观看的可选激励视频广告，例如用于复活、双倍苹果、获取免费游戏道具或在一局内试用商店道具。没有横幅广告或插屏广告。广告由Google AdMob（Google Mobile Ads SDK）提供，广告内容限制为“T”（青少年）评级。广告请求标记为非面向儿童。</p><p>Google SDK可能收集和处理广告ID、IP地址及由其推断的大致位置、设备和应用信息、广告互动数据以及诊断和性能数据。用途包括投放和衡量广告、控制展示频次、防止欺诈与保障安全以及广告分析。数据在传输过程中经过加密。</p><p>在需要同意的地区，仅在获得同意后展示个性化广告；否则Google可能展示非个性化广告或受限广告。</p><p>Google隐私信息：<a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>。</p><p>您可以在Android设置 &gt; 隐私 &gt; 广告中重置或删除广告ID；具体名称因设备而异。</p>"],
            ["4. 您的隐私选择与同意", "<p>在欧洲经济区、英国和瑞士，应用会在请求广告前显示Google同意表单（Google User Messaging Platform）。美国某些州的用户会看到允许其选择退出个人信息“出售”或“共享”的通知。</p><p>您可随时在游戏中的设置 &gt;“隐私选项”更改或撤回选择；该选项在法律要求的地区显示。</p><p>根据适用的GDPR或美国州法律，您的权利可能包括访问、删除、反对处理、撤回同意以及选择退出出售或共享。有关广告数据的请求请通过Google工具提出；您也可发送邮件至info@biemtech.com。</p>"],
            ["5. 儿童（13岁及以上）", "<p>Snake 3D面向13岁及以上玩家，不面向13岁以下儿童。我们不会有意收集13岁以下儿童的个人信息。如果家长认为其孩子已提供数据，可通过info@biemtech.com联系我们。</p>"],
            ["6. 互联网访问与权限", "<p>游戏可完全离线游玩。互联网仅用于加载广告和同意表单；离线时视频按钮会隐藏。</p><p>Android权限：</p><ul><li><code>INTERNET</code>和<code>ACCESS_NETWORK_STATE</code>，由Google Mobile Ads SDK添加。</li><li><code>com.google.android.gms.permission.AD_ID</code>，用于广告ID。</li><li><code>VIBRATE</code>，用于可选触觉反馈。</li></ul><p>应用不请求位置、相机、麦克风、联系人、照片或媒体、存储或通知权限。</p>"],
            ["7. 分享与Google Play链接", "<p>分享按钮会打开Android系统分享面板，包含简短文字（分数、关卡、成就名称或游戏名称）和Google Play链接。链接带有来源标记（utm_source / utm_medium），以便Google Play报告哪个分享按钮带来了访问；其中不包含个人数据。您自行选择应用和接收者。Snake 3D不访问联系人，也无法看到发送的内容。</p><p>“更多游戏”和“评价我们”会打开Google Play页面，这些页面适用Google Play自身的隐私政策。</p>"],
            ["8. 存储在您设备上的数据", "<p>以下数据仅存储在您的设备上，绝不会发送给BieMTech：</p><ul><li>设置：声音、音乐、振动、画质和语言。</li><li>进度：最高分、当前关卡、苹果（游戏货币）、已拥有及装备的商店道具和强化道具。</li><li>每日任务、每日礼物日历、成就和每日挑战状态。</li><li>统计：游玩次数、吃掉的苹果、最长蛇身、最佳连击、游玩时长、捕获的金鸟、已完成关卡、三星关卡、挑战获胜次数、限时模式最佳成绩和游玩天数。</li><li>用于在音频相关崩溃后关闭音乐的小型本地标记。</li></ul>"],
            ["9. 数据保留与删除", "<p>本地游戏数据会保留在设备上，直到您在Android设置中清除应用存储或卸载应用。BieMTech不会接收这些本地数据。有关Google处理的广告数据的访问或删除请求，请使用Google工具；您也可给我们发送邮件。</p>"],
            ["10. 本政策的变更", "<p>应用或数据处理方式变化时，我们可能更新本政策。更新内容将发布在本页，并修改最后更新日期。</p>"],
            ["11. 联系我们", "<p>如对本政策或Snake 3D的数据处理方式有疑问，请联系BieMTech：</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        hi: {
          dir: "ltr", back: "← BieMTech गोपनीयता नीतियाँ", subtitle: "गोपनीयता नीति", audience: "13 वर्ष और उससे अधिक आयु के लिए", rights: "सर्वाधिकार सुरक्षित।", app: "एप्लिकेशन", pkg: "पैकेज", updated: "अंतिम अपडेट", date: "3 नवंबर 2026",
          summary: "<strong>संक्षेप में:</strong> खाते की आवश्यकता नहीं है; गेम डेटा आपके डिवाइस पर रहता है। Google AdMob के वैकल्पिक इनाम वाले वीडियो विज्ञापन विज्ञापन आईडी और डिवाइस डेटा का उपयोग कर सकते हैं। जहाँ उपलब्ध हो, सेटिंग &gt; “गोपनीयता विकल्प” में अपनी पसंद बदल सकते हैं।",
          sections: [
            ["1. इस ऐप के बारे में", "<p>Snake 3D (com.biemtech.snake3d) 13 वर्ष और उससे अधिक आयु के खिलाड़ियों के लिए एक 3D आर्केड गेम है। यह नीति संस्करण 2.1.0 और उसके बाद के संस्करणों पर लागू होती है।</p><p>गेम की मुद्रा, सेब, केवल खेलकर या वैकल्पिक वीडियो देखकर अर्जित की जाती है। कोई इन-ऐप खरीदारी या वास्तविक पैसे का लेनदेन नहीं है।</p>"],
            ["2. हम कौन-सी जानकारी एकत्र करते हैं", "<p>खाते या लॉगिन की आवश्यकता नहीं है। चैट, उपयोगकर्ता द्वारा बनाई गई सामग्री, एनालिटिक्स SDK (Firebase या Google Analytics सहित) या क्रैश रिपोर्टिंग SDK नहीं है। गेम सेटिंग, प्रगति और आँकड़े डिवाइस पर रहते हैं और कभी BieMTech को नहीं भेजे जाते।</p><p>Google का विज्ञापन SDK नीचे बताए अनुसार डेटा एकत्र और संसाधित कर सकता है। BieMTech को AdMob से केवल समेकित विज्ञापन रिपोर्ट मिलती हैं, व्यक्तिगत डेटा नहीं, और वह व्यक्तिगत डेटा नहीं बेचता।</p>"],
            ["3. विज्ञापन (Google AdMob)", "<p>गेम में केवल वैकल्पिक इनाम वाले वीडियो विज्ञापन हैं जिन्हें आप स्वयं देखना चुनते हैं, जैसे पुनर्जीवित होने, दोगुने सेब पाने, मुफ्त गेम आइटम लेने या दुकान का आइटम एक बार की खेल पारी में आज़माने के लिए। बैनर या इंटरस्टिशियल विज्ञापन नहीं हैं। विज्ञापन Google AdMob (Google Mobile Ads SDK) देता है और उनकी सामग्री “T” (किशोर) रेटिंग तक सीमित है। विज्ञापन अनुरोध बच्चों के लिए निर्देशित नहीं होने के रूप में चिह्नित होते हैं।</p><p>Google SDK विज्ञापन आईडी, आईपी पता और उससे प्राप्त अनुमानित स्थान, डिवाइस और ऐप की जानकारी, विज्ञापन से इंटरैक्शन का डेटा तथा निदान/प्रदर्शन डेटा एकत्र और संसाधित कर सकता है। उद्देश्यों में विज्ञापन देना और मापना, प्रदर्शन की आवृत्ति सीमित करना, धोखाधड़ी की रोकथाम और सुरक्षा तथा विज्ञापन विश्लेषण शामिल हैं। डेटा भेजते समय एन्क्रिप्ट किया जाता है।</p><p>जहाँ सहमति आवश्यक है, वहाँ व्यक्तिगत विज्ञापन केवल सहमति मिलने पर दिखाए जाते हैं; अन्यथा Google गैर-व्यक्तिगत या सीमित विज्ञापन दिखा सकता है।</p><p>Google की गोपनीयता संबंधी जानकारी: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>।</p><p>Android सेटिंग &gt; गोपनीयता &gt; विज्ञापन में विज्ञापन आईडी रीसेट या मिटा सकते हैं; शब्दावली डिवाइस के अनुसार अलग हो सकती है।</p>"],
            ["4. आपकी गोपनीयता पसंद और सहमति", "<p>EEA, यूके और स्विट्ज़रलैंड में ऐप विज्ञापन माँगने से पहले Google का सहमति फ़ॉर्म (Google User Messaging Platform) दिखाता है। अमेरिका के कुछ राज्यों में उपयोगकर्ताओं को व्यक्तिगत जानकारी की “बिक्री” या “साझाकरण” से बाहर रहने का विकल्प देने वाली सूचना दिखाई जाती है।</p><p>गेम में सेटिंग &gt; “गोपनीयता विकल्प” से अपनी पसंद किसी भी समय बदल या वापस ले सकते हैं। यह विकल्प वहाँ दिखाया जाता है जहाँ कानून की आवश्यकता है।</p><p>लागू GDPR या अमेरिकी राज्य कानून के अनुसार आपके अधिकारों में पहुँच, मिटाना, आपत्ति करना, सहमति वापस लेना और बिक्री या साझाकरण से बाहर रहना शामिल हो सकते हैं। विज्ञापन डेटा के अनुरोध Google के टूल से करें; आप info@biemtech.com पर हमें ईमेल भी कर सकते हैं।</p>"],
            ["5. बच्चे (13+)", "<p>Snake 3D 13 वर्ष और उससे अधिक आयु के लिए है और 13 वर्ष से कम उम्र के बच्चों के लिए निर्देशित नहीं है। हम जानबूझकर 13 वर्ष से कम उम्र के बच्चों की व्यक्तिगत जानकारी एकत्र नहीं करते। यदि माता-पिता को लगता है कि उनके बच्चे ने डेटा दिया है, तो वे info@biemtech.com पर संपर्क कर सकते हैं।</p>"],
            ["6. इंटरनेट पहुँच और अनुमतियाँ", "<p>गेम पूरी तरह ऑफलाइन खेला जा सकता है। इंटरनेट केवल विज्ञापन और सहमति फ़ॉर्म लोड करने के लिए उपयोग होता है; ऑफलाइन होने पर वीडियो बटन छिप जाते हैं।</p><p>Android अनुमतियाँ:</p><ul><li><code>INTERNET</code> और <code>ACCESS_NETWORK_STATE</code>, Google Mobile Ads SDK द्वारा जोड़ी गई।</li><li>विज्ञापन आईडी के लिए <code>com.google.android.gms.permission.AD_ID</code>।</li><li>वैकल्पिक हैप्टिक फीडबैक के लिए <code>VIBRATE</code>।</li></ul><p>ऐप स्थान, कैमरा, माइक्रोफोन, संपर्क, फोटो/मीडिया, स्टोरेज या सूचनाओं की अनुमति नहीं माँगता।</p>"],
            ["7. साझा करना और Google Play के लिंक", "<p>शेयर बटन Android की सिस्टम शेयर शीट खोलते हैं, जिसमें छोटा पाठ (स्कोर, स्तर, उपलब्धि का नाम या गेम का नाम) और Google Play लिंक होता है। लिंक में रेफ़रल टैग (utm_source / utm_medium) होता है ताकि Google Play बता सके कि किस शेयर बटन से विज़िट आई; इसमें व्यक्तिगत डेटा नहीं होता। ऐप और प्राप्तकर्ता आप चुनते हैं। Snake 3D संपर्कों तक नहीं पहुँचता और भेजी गई सामग्री नहीं देखता।</p><p>“और गेम” तथा “हमें रेट करें” Google Play पेज खोलते हैं, जहाँ Google Play की अपनी गोपनीयता नीति लागू होती है।</p>"],
            ["8. आपके डिवाइस पर संग्रहीत डेटा", "<p>निम्न डेटा केवल आपके डिवाइस पर रहता है और कभी BieMTech को नहीं भेजा जाता:</p><ul><li>विकल्प: ध्वनि, संगीत, कंपन, ग्राफिक्स गुणवत्ता और भाषा।</li><li>प्रगति: सर्वश्रेष्ठ स्कोर, वर्तमान स्तर, सेब (गेम मुद्रा), दुकान से लिए गए और पहने हुए आइटम तथा बूस्टर।</li><li>दैनिक खोज, दैनिक उपहार कैलेंडर, उपलब्धियाँ और दैनिक चुनौती की स्थिति।</li><li>आँकड़े: खेले गए गेम, खाए गए सेब, सबसे लंबा साँप, श्रेष्ठ कॉम्बो, खेल समय, पकड़े गए सुनहरे पक्षी, पूरे किए स्तर, 3-स्टार स्तर, जीती चुनौतियाँ, टाइम-अटैक का सर्वश्रेष्ठ परिणाम और खेले गए दिन।</li><li>ऑडियो संबंधी क्रैश के बाद संगीत बंद करने वाला छोटा स्थानीय संकेत।</li></ul>"],
            ["9. डेटा रखना और मिटाना", "<p>स्थानीय गेम डेटा आपके डिवाइस पर तब तक रहता है जब तक आप Android सेटिंग में ऐप का स्टोरेज साफ नहीं करते या ऐप अनइंस्टॉल नहीं करते। BieMTech को यह स्थानीय डेटा नहीं मिलता। Google द्वारा संसाधित विज्ञापन डेटा तक पहुँच या उसे मिटाने के अनुरोध Google के टूल से करें; आप हमें ईमेल भी कर सकते हैं।</p>"],
            ["10. इस नीति में बदलाव", "<p>ऐप या डेटा संबंधी प्रक्रियाएँ बदलने पर हम यह नीति अपडेट कर सकते हैं। अपडेट इस पेज पर संशोधित अंतिम अपडेट तिथि के साथ दिखाए जाएँगे।</p>"],
            ["11. हमसे संपर्क करें", "<p>इस नीति या Snake 3D की डेटा संबंधी प्रक्रियाओं पर प्रश्नों के लिए BieMTech से संपर्क करें:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        es: {
          dir: "ltr", back: "← Políticas de privacidad de BieMTech", subtitle: "Política de privacidad", audience: "Para personas de 13 años en adelante", rights: "Todos los derechos reservados.", app: "Aplicación", pkg: "Paquete", updated: "Última actualización", date: "3 de noviembre de 2026",
          summary: "<strong>Resumen:</strong> No se necesita cuenta; los datos del juego permanecen en tu dispositivo. Los anuncios de vídeo recompensados opcionales de Google AdMob pueden usar el identificador publicitario y datos del dispositivo. Puedes cambiar tus preferencias en Ajustes &gt; «Opciones de privacidad» donde esté disponible.",
          sections: [
            ["1. Acerca de esta aplicación", "<p>Snake 3D (com.biemtech.snake3d) es un juego arcade 3D para personas de 13 años en adelante. Esta política se aplica a la versión 2.1.0 y posteriores.</p><p>Las manzanas, la moneda del juego, solo se obtienen jugando o viendo vídeos opcionales. No hay compras dentro de la aplicación ni transacciones con dinero real.</p>"],
            ["2. Información que recopilamos", "<p>No se necesita cuenta ni inicio de sesión. No hay chat, contenido generado por usuarios, SDK de analítica (incluidos Firebase o Google Analytics) ni SDK de informes de fallos. Los ajustes, el progreso y las estadísticas del juego permanecen en tu dispositivo y nunca se envían a BieMTech.</p><p>El SDK publicitario de Google puede recopilar y tratar datos como se describe a continuación. BieMTech solo recibe informes publicitarios agregados de AdMob, sin datos personales, y no vende datos personales.</p>"],
            ["3. Publicidad (Google AdMob)", "<p>El juego solo ofrece anuncios de vídeo recompensados opcionales que eliges ver, por ejemplo para revivir, duplicar manzanas, conseguir objetos gratuitos o probar un objeto de la tienda durante una partida. No hay banners ni anuncios intersticiales. Los anuncios los sirve Google AdMob (Google Mobile Ads SDK), con contenido limitado a la clasificación «T» (adolescentes). Las solicitudes de anuncios se marcan como no dirigidas a niños.</p><p>El SDK de Google puede recopilar y tratar el identificador publicitario, la dirección IP y la ubicación aproximada derivada de ella, información del dispositivo y la aplicación, interacciones con anuncios y datos de diagnóstico/rendimiento. Los fines incluyen mostrar y medir anuncios, limitar su frecuencia, prevenir fraudes y garantizar la seguridad, y analizar la publicidad. Los datos se cifran en tránsito.</p><p>Donde se exige consentimiento, los anuncios personalizados solo se muestran con él; de lo contrario, Google puede mostrar anuncios no personalizados o limitados.</p><p>Información de privacidad de Google: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Puedes restablecer o eliminar el identificador publicitario en Ajustes de Android &gt; Privacidad &gt; Anuncios; los nombres varían según el dispositivo.</p>"],
            ["4. Tus opciones de privacidad y consentimiento", "<p>En el EEE, Reino Unido y Suiza, la aplicación muestra el formulario de consentimiento de Google (Google User Messaging Platform) antes de solicitar anuncios. En determinados estados de EE. UU., se muestra un aviso que permite rechazar la «venta» o el «intercambio» de información personal.</p><p>Puedes cambiar o retirar tus preferencias en cualquier momento desde Ajustes &gt; «Opciones de privacidad» del juego, que se muestra donde la ley lo exige.</p><p>Según el RGPD o la legislación estatal estadounidense aplicable, tus derechos pueden incluir acceso, supresión, oposición, retirada del consentimiento y rechazo de la venta o el intercambio. Las solicitudes sobre datos publicitarios se tramitan mediante las herramientas de Google; también puedes escribirnos a info@biemtech.com.</p>"],
            ["5. Menores (13+)", "<p>Snake 3D es para personas de 13 años en adelante y no se dirige a menores de 13 años. No recopilamos deliberadamente información personal de menores de 13 años. Si un progenitor cree que su hijo ha proporcionado datos, puede contactarnos en info@biemtech.com.</p>"],
            ["6. Acceso a Internet y permisos", "<p>El juego se puede jugar por completo sin conexión. Internet solo se usa para cargar anuncios y el formulario de consentimiento; sin conexión, los botones de vídeo se ocultan.</p><p>Permisos de Android:</p><ul><li><code>INTERNET</code> y <code>ACCESS_NETWORK_STATE</code>, añadidos por Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> para el identificador publicitario.</li><li><code>VIBRATE</code> para la respuesta háptica opcional.</li></ul><p>La aplicación no solicita permisos de ubicación, cámara, micrófono, contactos, fotos/multimedia, almacenamiento ni notificaciones.</p>"],
            ["7. Compartir y enlaces a Google Play", "<p>Los botones de compartir abren la hoja de compartir del sistema Android con un texto breve (puntuación, nivel, nombre de un logro o del juego) y un enlace a Google Play. El enlace incluye una etiqueta de referencia (utm_source / utm_medium) para que Google Play informe de qué botón de compartir originó una visita; no contiene datos personales. Tú eliges la aplicación y el destinatario. Snake 3D no accede a los contactos ni ve lo que se envía.</p><p>«Más juegos» y «Valóranos» abren páginas de Google Play, donde se aplica su propia política de privacidad.</p>"],
            ["8. Datos almacenados en tu dispositivo", "<p>Estos datos se guardan solo en tu dispositivo y nunca se envían a BieMTech:</p><ul><li>Opciones: sonido, música, vibración, calidad gráfica e idioma.</li><li>Progreso: mejor puntuación, nivel actual, manzanas (moneda del juego), objetos de la tienda adquiridos y equipados, y potenciadores.</li><li>Misión diaria, calendario de regalos diarios, logros y estado del desafío diario.</li><li>Estadísticas: partidas jugadas, manzanas comidas, serpiente más larga, mejor combo, tiempo de juego, pájaros dorados atrapados, niveles completados, niveles de 3 estrellas, desafíos ganados, mejor resultado contrarreloj y días jugados.</li><li>Un pequeño marcador local que desactiva la música después de un fallo relacionado con el audio.</li></ul>"],
            ["9. Conservación y eliminación de datos", "<p>Los datos locales permanecen en tu dispositivo hasta que borres el almacenamiento de la aplicación en Ajustes de Android o la desinstales. BieMTech no recibe estos datos locales. Para solicitar acceso o supresión de datos publicitarios tratados por Google, usa sus herramientas; también puedes escribirnos.</p>"],
            ["10. Cambios en esta política", "<p>Podemos actualizar esta política si cambia la aplicación o sus prácticas de datos. Las actualizaciones aparecerán en esta página con una nueva fecha de última actualización.</p>"],
            ["11. Contacto", "<p>Para preguntas sobre esta política o las prácticas de datos de Snake 3D, contacta con BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        ar: {
          dir: "rtl", back: "سياسات خصوصية BieMTech ←", subtitle: "سياسة الخصوصية", audience: "للأعمار من 13 سنة فما فوق", rights: "جميع الحقوق محفوظة.", app: "التطبيق", pkg: "الحزمة", updated: "آخر تحديث", date: "3 نوفمبر 2026",
          summary: "<strong>ملخص:</strong> لا يلزم حساب؛ تبقى بيانات اللعبة على جهازك. قد تستخدم إعلانات الفيديو الاختيارية بمكافأة من Google AdMob معرّف الإعلانات وبيانات الجهاز. يمكنك تغيير اختياراتك من الإعدادات &gt; «خيارات الخصوصية» حيثما تتوفر.",
          sections: [
            ["1. حول هذا التطبيق", "<p>Snake 3D ‏(com.biemtech.snake3d) لعبة أركيد ثلاثية الأبعاد للأعمار من 13 سنة فما فوق. تنطبق هذه السياسة على الإصدار 2.1.0 والإصدارات اللاحقة.</p><p>يُكتسب التفاح، عملة اللعبة، فقط باللعب أو بمشاهدة فيديوهات اختيارية. لا توجد مشتريات داخل التطبيق أو معاملات بأموال حقيقية.</p>"],
            ["2. المعلومات التي نجمعها", "<p>لا يلزم حساب أو تسجيل دخول. لا توجد دردشة أو محتويات ينشئها المستخدمون أو حزمة SDK للتحليلات (بما فيها Firebase أو Google Analytics) أو حزمة SDK للإبلاغ عن الأعطال. تبقى إعدادات اللعبة والتقدم والإحصاءات على جهازك ولا تُرسل مطلقًا إلى BieMTech.</p><p>قد تجمع حزمة SDK للإعلانات من Google البيانات وتعالجها كما هو موضح أدناه. تتلقى BieMTech فقط تقارير إعلانية مجمّعة من AdMob، دون بيانات شخصية، ولا تبيع البيانات الشخصية.</p>"],
            ["3. الإعلانات (Google AdMob)", "<p>تقدم اللعبة فقط إعلانات فيديو اختيارية بمكافأة تختار مشاهدتها، مثل إحياء اللاعب أو مضاعفة التفاح أو الحصول على عناصر مجانية أو تجربة عنصر من المتجر لجولة واحدة. لا توجد إعلانات بانر أو إعلانات بينية. تعرض Google AdMob ‏(Google Mobile Ads SDK) الإعلانات مع تقييد محتواها بتصنيف «T» (للمراهقين). وتُوسم طلبات الإعلانات بأنها غير موجّهة للأطفال.</p><p>قد تجمع حزمة Google وتعالج معرّف الإعلانات وعنوان IP والموقع التقريبي المستنتج منه ومعلومات الجهاز والتطبيق وبيانات التفاعل مع الإعلانات وبيانات التشخيص والأداء. تشمل الأغراض عرض الإعلانات وقياسها وتحديد تكرارها ومنع الاحتيال والأمان وتحليلات الإعلانات. تُشفّر البيانات أثناء النقل.</p><p>حيث تُشترط الموافقة، لا تُعرض إعلانات مخصّصة إلا بها؛ وإلا فقد تعرض Google إعلانات غير مخصّصة أو محدودة.</p><p>معلومات خصوصية Google: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>يمكن إعادة ضبط معرّف الإعلانات أو حذفه من إعدادات Android &gt; الخصوصية &gt; الإعلانات؛ وقد تختلف المسميات حسب الجهاز.</p>"],
            ["4. خيارات الخصوصية والموافقة", "<p>في المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا، يعرض التطبيق نموذج موافقة Google ‏(Google User Messaging Platform) قبل طلب الإعلانات. يرى المستخدمون في بعض الولايات الأمريكية إشعارًا يتيح رفض «بيع» المعلومات الشخصية أو «مشاركتها».</p><p>يمكن تغيير اختياراتك أو سحبها في أي وقت داخل اللعبة من الإعدادات &gt; «خيارات الخصوصية»، التي تظهر حيث يقتضي القانون.</p><p>وفقًا للائحة GDPR أو قوانين الولايات الأمريكية المعمول بها، قد تشمل حقوقك الوصول والحذف والاعتراض وسحب الموافقة ورفض البيع أو المشاركة. تُقدَّم طلبات بيانات الإعلانات عبر أدوات Google؛ ويمكنك أيضًا مراسلتنا على info@biemtech.com.</p>"],
            ["5. الأطفال (13+)", "<p>Snake 3D للأعمار من 13 سنة فما فوق وليست موجّهة للأطفال دون 13 سنة. لا نجمع عمدًا معلومات شخصية من الأطفال دون 13 سنة. يمكن لولي أمر يعتقد أن طفله قدّم بيانات التواصل معنا على info@biemtech.com.</p>"],
            ["6. الاتصال بالإنترنت والأذونات", "<p>يمكن لعب اللعبة بالكامل دون اتصال. يُستخدم الإنترنت فقط لتحميل الإعلانات ونموذج الموافقة؛ وتُخفى أزرار الفيديو عند عدم الاتصال.</p><p>أذونات Android:</p><ul><li><code>INTERNET</code> و<code>ACCESS_NETWORK_STATE</code>، تضيفهما Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> لمعرّف الإعلانات.</li><li><code>VIBRATE</code> للاستجابة اللمسية الاختيارية.</li></ul><p>لا يطلب التطبيق أذونات الموقع أو الكاميرا أو الميكروفون أو جهات الاتصال أو الصور/الوسائط أو التخزين أو الإشعارات.</p>"],
            ["7. المشاركة وروابط Google Play", "<p>تفتح أزرار المشاركة لوحة المشاركة الخاصة بنظام Android مع نص قصير (نتيجة أو مستوى أو اسم إنجاز أو اسم اللعبة) ورابط Google Play. يتضمن الرابط وسم إحالة (utm_source / utm_medium) حتى تتمكن Google Play من الإبلاغ عن زر المشاركة الذي جلب الزيارة؛ ولا يحتوي على بيانات شخصية. أنت تختار التطبيق والمستلم. لا تصل Snake 3D إلى جهات الاتصال ولا ترى ما يُرسل.</p><p>يفتح «المزيد من الألعاب» و«قيّمنا» صفحات Google Play، حيث تنطبق سياسة خصوصية Google Play الخاصة.</p>"],
            ["8. البيانات المخزنة على جهازك", "<p>تُخزن البيانات التالية على جهازك فقط ولا تُرسل مطلقًا إلى BieMTech:</p><ul><li>الخيارات: الصوت والموسيقى والاهتزاز وجودة الرسومات واللغة.</li><li>التقدم: أفضل نتيجة والمستوى الحالي والتفاح (عملة اللعبة) وعناصر المتجر المملوكة والمجهزة والمعززات.</li><li>المهمة اليومية وتقويم الهدايا اليومية والإنجازات وحالة التحدي اليومي.</li><li>الإحصاءات: المباريات الملعوبة والتفاح المأكول وأطول ثعبان وأفضل سلسلة ووقت اللعب والطيور الذهبية المصطادة والمستويات المكتملة ومستويات الثلاث نجوم والتحديات الفائزة وأفضل نتيجة في سباق الوقت وأيام اللعب.</li><li>علامة محلية صغيرة توقف الموسيقى بعد عطل متعلق بالصوت.</li></ul>"],
            ["9. الاحتفاظ بالبيانات وحذفها", "<p>تبقى بيانات اللعبة المحلية على جهازك حتى تمسح مساحة تخزين التطبيق من إعدادات Android أو تزيل التطبيق. لا تتلقى BieMTech هذه البيانات المحلية. لطلبات الوصول إلى بيانات الإعلانات التي تعالجها Google أو حذفها، استخدم أدوات Google؛ ويمكنك أيضًا مراسلتنا.</p>"],
            ["10. التغييرات على هذه السياسة", "<p>قد نحدّث هذه السياسة عند تغيّر التطبيق أو ممارسات البيانات. ستظهر التحديثات على هذه الصفحة مع تاريخ تحديث معدّل.</p>"],
            ["11. اتصل بنا", "<p>للأسئلة حول هذه السياسة أو ممارسات بيانات Snake 3D، تواصل مع BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        pt: {
          dir: "ltr", back: "← Políticas de Privacidade BieMTech", subtitle: "Política de Privacidade", audience: "Para idades a partir de 13 anos", rights: "Todos os direitos reservados.", app: "Aplicativo", pkg: "Pacote", updated: "Última atualização", date: "3 de novembro de 2026",
          summary: "<strong>Resumo:</strong> Não é necessária uma conta; os dados do jogo ficam no dispositivo. Os anúncios de vídeo com recompensa opcionais do Google AdMob podem usar o ID de publicidade e dados do dispositivo. Pode alterar as escolhas em Definições &gt; «Opções de privacidade», onde estiver disponível.",
          sections: [
            ["1. Sobre esta aplicação", "<p>Snake 3D (com.biemtech.snake3d) é um jogo arcade 3D para pessoas a partir de 13 anos. Esta política aplica-se à versão 2.1.0 e posteriores.</p><p>As maçãs, a moeda do jogo, só são obtidas ao jogar ou ver vídeos opcionais. Não há compras na aplicação nem transações com dinheiro real.</p>"],
            ["2. Informações que recolhemos", "<p>Não é necessária uma conta ou início de sessão. Não há chat, conteúdo criado por utilizadores, SDK de análise (incluindo Firebase ou Google Analytics) nem SDK de relatórios de falhas. As definições, o progresso e as estatísticas ficam no dispositivo e nunca são enviados à BieMTech.</p><p>O SDK de publicidade da Google pode recolher e tratar dados conforme descrito abaixo. A BieMTech recebe apenas relatórios publicitários agregados do AdMob, sem dados pessoais, e não vende dados pessoais.</p>"],
            ["3. Publicidade (Google AdMob)", "<p>O jogo oferece apenas anúncios de vídeo com recompensa opcionais que escolhe ver, por exemplo para reviver, duplicar maçãs, obter itens gratuitos ou experimentar um item da loja durante uma partida. Não há banners nem anúncios intersticiais. Os anúncios são apresentados pelo Google AdMob (Google Mobile Ads SDK), com conteúdo limitado à classificação «T» (adolescentes). Os pedidos de anúncios são marcados como não dirigidos a crianças.</p><p>O SDK da Google pode recolher e tratar o ID de publicidade, endereço IP e localização aproximada derivada dele, informações do dispositivo e da aplicação, dados de interação com anúncios e dados de diagnóstico/desempenho. Os fins incluem apresentar e medir anúncios, limitar a frequência, prevenir fraude e garantir a segurança, e analisar publicidade. Os dados são encriptados em trânsito.</p><p>Onde é exigido consentimento, os anúncios personalizados só são apresentados com consentimento; caso contrário, a Google pode apresentar anúncios não personalizados ou limitados.</p><p>Informações de privacidade da Google: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Pode repor ou eliminar o ID de publicidade em Definições do Android &gt; Privacidade &gt; Anúncios; os nomes variam conforme o dispositivo.</p>"],
            ["4. As suas escolhas de privacidade e consentimento", "<p>No EEE, Reino Unido e Suíça, a aplicação apresenta o formulário de consentimento da Google (Google User Messaging Platform) antes de pedir anúncios. Em determinados estados dos EUA, os utilizadores veem um aviso que permite recusar a «venda» ou «partilha» de informações pessoais.</p><p>Pode alterar ou retirar as suas escolhas a qualquer momento no jogo, em Definições &gt; «Opções de privacidade», apresentadas onde a lei o exige.</p><p>Consoante o RGPD ou a lei estadual dos EUA aplicável, os seus direitos podem incluir acesso, apagamento, oposição, retirada do consentimento e recusa da venda ou partilha. Os pedidos sobre dados publicitários são feitos através das ferramentas da Google; também pode escrever-nos para info@biemtech.com.</p>"],
            ["5. Crianças (13+)", "<p>Snake 3D destina-se a pessoas a partir de 13 anos e não é dirigido a crianças com menos de 13 anos. Não recolhemos intencionalmente informações pessoais de crianças com menos de 13 anos. Um responsável que acredite que o seu filho forneceu dados pode contactar-nos em info@biemtech.com.</p>"],
            ["6. Acesso à Internet e permissões", "<p>O jogo é totalmente jogável offline. A Internet só é usada para carregar anúncios e o formulário de consentimento; offline, os botões de vídeo ficam ocultos.</p><p>Permissões Android:</p><ul><li><code>INTERNET</code> e <code>ACCESS_NETWORK_STATE</code>, adicionadas pelo Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> para o ID de publicidade.</li><li><code>VIBRATE</code> para resposta háptica opcional.</li></ul><p>A aplicação não pede permissões de localização, câmara, microfone, contactos, fotografias/multimédia, armazenamento ou notificações.</p>"],
            ["7. Partilha e ligações ao Google Play", "<p>Os botões de partilha abrem a folha de partilha do sistema Android com um texto curto (pontuação, nível, nome de conquista ou do jogo) e uma ligação ao Google Play. A ligação inclui uma etiqueta de referência (utm_source / utm_medium) para que o Google Play indique qual o botão de partilha que trouxe uma visita; não contém dados pessoais. Escolhe a aplicação e o destinatário. Snake 3D não acede aos contactos nem vê o que é enviado.</p><p>«Mais jogos» e «Avalie-nos» abrem páginas do Google Play, onde se aplica a política de privacidade do próprio Google Play.</p>"],
            ["8. Dados guardados no seu dispositivo", "<p>Os seguintes dados são guardados apenas no seu dispositivo e nunca são enviados à BieMTech:</p><ul><li>Opções: som, música, vibração, qualidade gráfica e idioma.</li><li>Progresso: melhor pontuação, nível atual, maçãs (moeda do jogo), itens da loja adquiridos e equipados, e potenciadores.</li><li>Missão diária, calendário de presentes diários, conquistas e estado do desafio diário.</li><li>Estatísticas: partidas jogadas, maçãs comidas, cobra mais longa, melhor combo, tempo de jogo, pássaros dourados capturados, níveis concluídos, níveis de 3 estrelas, desafios ganhos, melhor resultado contrarrelógio e dias jogados.</li><li>Um pequeno marcador local que desliga a música após uma falha relacionada com áudio.</li></ul>"],
            ["9. Conservação e eliminação de dados", "<p>Os dados locais ficam no dispositivo até limpar o armazenamento da aplicação nas Definições do Android ou desinstalar a aplicação. A BieMTech não recebe estes dados locais. Para pedidos de acesso ou eliminação de dados publicitários tratados pela Google, use as ferramentas da Google; também pode enviar-nos um e-mail.</p>"],
            ["10. Alterações a esta política", "<p>Podemos atualizar esta política se a aplicação ou as práticas de dados mudarem. As atualizações aparecerão nesta página com uma nova data de última atualização.</p>"],
            ["11. Contacte-nos", "<p>Para questões sobre esta política ou as práticas de dados do Snake 3D, contacte a BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        ru: {
          dir: "ltr", back: "← Политики конфиденциальности BieMTech", subtitle: "Политика конфиденциальности", audience: "Для игроков от 13 лет", rights: "Все права защищены.", app: "Приложение", pkg: "Пакет", updated: "Последнее обновление", date: "3 ноября 2026 г.",
          summary: "<strong>Кратко:</strong> Аккаунт не нужен; игровые данные остаются на устройстве. Добровольные видеоролики с наградой от Google AdMob могут использовать рекламный идентификатор и данные устройства. Выбор можно изменить в Настройках &gt; «Параметры конфиденциальности», где этот пункт доступен.",
          sections: [
            ["1. Об этом приложении", "<p>Snake 3D (com.biemtech.snake3d) — трёхмерная аркада для игроков от 13 лет. Эта политика применяется к версии 2.1.0 и последующим.</p><p>Яблоки — игровую валюту — можно получить только за игру или просмотр добровольных видеороликов. Встроенных покупок и операций с реальными деньгами нет.</p>"],
            ["2. Какую информацию мы собираем", "<p>Аккаунт и вход не требуются. В игре нет чата, пользовательского контента, SDK аналитики (включая Firebase и Google Analytics) или SDK отчётов о сбоях. Настройки, прогресс и статистика остаются на устройстве и никогда не отправляются BieMTech.</p><p>Рекламный SDK Google может собирать и обрабатывать данные, описанные ниже. BieMTech получает только сводные рекламные отчёты AdMob, без персональных данных, и не продаёт персональные данные.</p>"],
            ["3. Реклама (Google AdMob)", "<p>В игре есть только добровольные видеоролики с наградой, которые вы сами выбираете смотреть: например, для возрождения, удвоения яблок, получения бесплатных предметов или примерки предмета из магазина на одну попытку. Баннеров и межстраничной рекламы нет. Реклама предоставляется Google AdMob (Google Mobile Ads SDK); её содержание ограничено рейтингом «T» (для подростков). Запросы рекламы помечаются как не предназначенные для детей.</p><p>SDK Google может собирать и обрабатывать рекламный идентификатор, IP-адрес и определённое по нему приблизительное местоположение, сведения об устройстве и приложении, данные взаимодействия с рекламой, диагностики и производительности. Цели: показ и измерение рекламы, ограничение частоты показов, предотвращение мошенничества и обеспечение безопасности, а также рекламная аналитика. Данные шифруются при передаче.</p><p>Там, где требуется согласие, персонализированная реклама показывается только с ним; иначе Google может показывать неперсонализированную или ограниченную рекламу.</p><p>Информация Google о конфиденциальности: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Рекламный идентификатор можно сбросить или удалить в Настройках Android &gt; Конфиденциальность &gt; Реклама; названия зависят от устройства.</p>"],
            ["4. Ваш выбор конфиденциальности и согласие", "<p>В ЕЭЗ, Великобритании и Швейцарии приложение показывает форму согласия Google (Google User Messaging Platform) до запроса рекламы. В некоторых штатах США пользователи видят уведомление, позволяющее отказаться от «продажи» или «передачи» персональной информации.</p><p>Изменить или отозвать свой выбор можно в любое время в игре: Настройки &gt; «Параметры конфиденциальности». Этот пункт показывается там, где этого требует закон.</p><p>В зависимости от применимого GDPR или законодательства штата США ваши права могут включать доступ, удаление, возражение, отзыв согласия и отказ от продажи или передачи. Запросы о рекламных данных подаются через инструменты Google; также можно написать нам на info@biemtech.com.</p>"],
            ["5. Дети (13+)", "<p>Snake 3D предназначена для игроков от 13 лет и не ориентирована на детей младше 13 лет. Мы сознательно не собираем персональную информацию детей младше 13 лет. Если родитель считает, что его ребёнок предоставил данные, он может связаться с нами по адресу info@biemtech.com.</p>"],
            ["6. Доступ к Интернету и разрешения", "<p>В игру можно полноценно играть офлайн. Интернет используется только для загрузки рекламы и формы согласия; офлайн кнопки видео скрыты.</p><p>Разрешения Android:</p><ul><li><code>INTERNET</code> и <code>ACCESS_NETWORK_STATE</code>, добавляемые Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> для рекламного идентификатора.</li><li><code>VIBRATE</code> для необязательного тактильного отклика.</li></ul><p>Приложение не запрашивает разрешения на местоположение, камеру, микрофон, контакты, фото/медиа, хранилище или уведомления.</p>"],
            ["7. Отправка и ссылки на Google Play", "<p>Кнопки «Поделиться» открывают системное меню отправки Android с коротким текстом (счёт, уровень, название достижения или игры) и ссылкой на Google Play. Ссылка содержит метку источника (utm_source / utm_medium), чтобы Google Play мог сообщить, какая кнопка привела посетителя; персональных данных в ней нет. Приложение и получателя выбираете вы. Snake 3D не имеет доступа к контактам и не видит отправляемое содержимое.</p><p>«Другие игры» и «Оцените нас» открывают страницы Google Play, где действует собственная политика конфиденциальности Google Play.</p>"],
            ["8. Данные на вашем устройстве", "<p>Следующие данные хранятся только на устройстве и никогда не отправляются BieMTech:</p><ul><li>Настройки: звук, музыка, вибрация, качество графики и язык.</li><li>Прогресс: лучший счёт, текущий уровень, яблоки (игровая валюта), приобретённые и надетые предметы магазина, усилители.</li><li>Ежедневное задание, календарь ежедневных подарков, достижения и состояние ежедневного испытания.</li><li>Статистика: сыгранные партии, съеденные яблоки, самая длинная змейка, лучшее комбо, время игры, пойманные золотые птицы, пройденные уровни, уровни на 3 звезды, выигранные испытания, лучший результат игры на время и дни игры.</li><li>Небольшая локальная отметка, отключающая музыку после сбоя, связанного со звуком.</li></ul>"],
            ["9. Хранение и удаление данных", "<p>Локальные игровые данные остаются на устройстве, пока вы не очистите хранилище приложения в Настройках Android или не удалите приложение. BieMTech не получает эти локальные данные. Для запросов на доступ к рекламным данным, обрабатываемым Google, или их удаление используйте инструменты Google; также можно написать нам.</p>"],
            ["10. Изменения этой политики", "<p>Мы можем обновлять политику при изменении приложения или практик обработки данных. Обновления появятся на этой странице с новой датой последнего изменения.</p>"],
            ["11. Связаться с нами", "<p>По вопросам об этой политике или обработке данных Snake 3D свяжитесь с BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        ja: {
          dir: "ltr", back: "← BieMTech プライバシーポリシー", subtitle: "プライバシーポリシー", audience: "13歳以上の方が対象", rights: "無断転載を禁じます。", app: "アプリ", pkg: "パッケージ", updated: "最終更新日", date: "2026年11月3日",
          summary: "<strong>概要：</strong>アカウントは不要で、ゲームデータは端末内に保存されます。Google AdMobの任意のリワード動画広告では、広告IDや端末データが使用される場合があります。提供される地域では、設定 &gt;「プライバシー オプション」で選択を変更できます。",
          sections: [
            ["1. このアプリについて", "<p>Snake 3D（com.biemtech.snake3d）は13歳以上を対象とする3Dアーケードゲームです。本ポリシーはバージョン2.1.0以降に適用されます。</p><p>ゲーム内通貨のリンゴは、プレイまたは任意の動画視聴でのみ獲得できます。アプリ内購入や実際のお金による取引はありません。</p>"],
            ["2. 収集する情報", "<p>アカウントやログインは不要です。チャット、ユーザー生成コンテンツ、分析SDK（FirebaseやGoogle Analyticsを含む）、クラッシュ報告SDKはありません。ゲームの設定、進行状況、統計は端末内に保存され、BieMTechに送信されることはありません。</p><p>Googleの広告SDKは、以下のとおりデータを収集・処理する場合があります。BieMTechが受け取るのはAdMobの集計済み広告レポートのみで、個人データは受け取りません。BieMTechは個人データを販売しません。</p>"],
            ["3. 広告（Google AdMob）", "<p>ゲームで提供する広告は、復活、リンゴの倍増、無料アイテムの獲得、ショップアイテムを1回のプレイで試すなどのために、ご自身で視聴を選ぶ任意のリワード動画広告のみです。バナー広告やインタースティシャル広告はありません。広告はGoogle AdMob（Google Mobile Ads SDK）が配信し、コンテンツは「T」（青少年向け）のレーティングに制限されます。広告リクエストには子ども向けではないことを示す設定が付けられます。</p><p>GoogleのSDKは、広告ID、IPアドレスとそれに基づくおおよその位置、端末とアプリの情報、広告への反応データ、診断・パフォーマンスデータを収集・処理する場合があります。目的は広告の配信と測定、表示頻度の制限、不正防止とセキュリティ、広告分析です。データは転送中に暗号化されます。</p><p>同意が必要な地域では、同意がある場合にのみパーソナライズド広告を表示します。それ以外の場合、Googleはパーソナライズされていない広告や制限付き広告を表示することがあります。</p><p>Googleのプライバシー情報：<a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>。</p><p>広告IDはAndroidの設定 &gt; プライバシー &gt; 広告でリセットまたは削除できます。表記は端末によって異なります。</p>"],
            ["4. プライバシーの選択と同意", "<p>EEA、英国、スイスでは、広告をリクエストする前にGoogleの同意フォーム（Google User Messaging Platform）を表示します。米国の一部の州では、個人情報の「販売」または「共有」を拒否できる通知を表示します。</p><p>ゲーム内の設定 &gt;「プライバシー オプション」で、いつでも選択を変更または撤回できます。この項目は法律で必要とされる地域で表示されます。</p><p>適用されるGDPRまたは米国州法により、アクセス、削除、異議申立て、同意の撤回、販売・共有の拒否などの権利が認められる場合があります。広告データに関する請求はGoogleのツールで行ってください。info@biemtech.comへのお問い合わせも可能です。</p>"],
            ["5. 子どもについて（13歳以上）", "<p>Snake 3Dは13歳以上を対象とし、13歳未満の子ども向けではありません。13歳未満の子どもから個人情報を意図的に収集することはありません。お子様がデータを提供したと思われる保護者の方は、info@biemtech.comまでご連絡ください。</p>"],
            ["6. インターネット接続と権限", "<p>ゲームは完全にオフラインでプレイできます。インターネットは広告と同意フォームの読み込みにのみ使用し、オフライン時には動画ボタンが非表示になります。</p><p>Androidの権限：</p><ul><li>Google Mobile Ads SDKが追加する<code>INTERNET</code>と<code>ACCESS_NETWORK_STATE</code>。</li><li>広告ID用の<code>com.google.android.gms.permission.AD_ID</code>。</li><li>任意の触覚フィードバック用の<code>VIBRATE</code>。</li></ul><p>位置情報、カメラ、マイク、連絡先、写真・メディア、ストレージ、通知の権限は要求しません。</p>"],
            ["7. 共有とGoogle Playへのリンク", "<p>共有ボタンは、短いテキスト（スコア、レベル、実績名、ゲーム名）とGoogle Playへのリンクを含むAndroidのシステム共有シートを開きます。リンクには、どの共有ボタンから訪問したかをGoogle Playが報告できる参照タグ（utm_source / utm_medium）が含まれます。個人データは含まれません。アプリと送信先はご自身で選びます。Snake 3Dは連絡先にアクセスせず、送信内容も確認しません。</p><p>「その他のゲーム」と「評価する」はGoogle Playのページを開き、そこではGoogle Play独自のプライバシーポリシーが適用されます。</p>"],
            ["8. 端末に保存されるデータ", "<p>以下のデータは端末内にのみ保存され、BieMTechに送信されることはありません。</p><ul><li>設定：効果音、音楽、振動、画質、言語。</li><li>進行状況：最高スコア、現在のレベル、リンゴ（ゲーム内通貨）、所有・装備しているショップアイテム、ブースター。</li><li>デイリークエスト、毎日のギフトカレンダー、実績、デイリーチャレンジの状態。</li><li>統計：プレイ回数、食べたリンゴ、最長のヘビ、最高コンボ、プレイ時間、捕まえた金の鳥、クリアしたレベル、星3つのレベル、勝利したチャレンジ、タイムアタックの最高記録、プレイ日数。</li><li>音声関連のクラッシュ後に音楽をオフにする小さなローカルマーカー。</li></ul>"],
            ["9. データの保持と削除", "<p>ローカルのゲームデータは、Androidの設定でアプリのストレージを消去するか、アプリをアンインストールするまで端末に残ります。BieMTechはこのローカルデータを受け取りません。Googleが処理する広告データへのアクセスや削除の請求にはGoogleのツールをご利用ください。メールでもお問い合わせいただけます。</p>"],
            ["10. 本ポリシーの変更", "<p>アプリやデータの取扱いが変更された場合、本ポリシーを更新することがあります。更新内容は本ページに掲載し、最終更新日を変更します。</p>"],
            ["11. お問い合わせ", "<p>本ポリシーやSnake 3Dのデータの取扱いに関するご質問は、BieMTechまでお問い合わせください。</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        de: {
          dir: "ltr", back: "← BieMTech Datenschutzerklärungen", subtitle: "Datenschutzerklärung", audience: "Ab 13 Jahren", rights: "Alle Rechte vorbehalten.", app: "Anwendung", pkg: "Paket", updated: "Zuletzt aktualisiert", date: "3. November 2026",
          summary: "<strong>Kurzfassung:</strong> Kein Konto erforderlich; Spieldaten bleiben auf deinem Gerät. Freiwillige Belohnungsvideos von Google AdMob können die Werbe-ID und Gerätedaten verwenden. Du kannst deine Auswahl unter Einstellungen &gt; „Datenschutzoptionen“ ändern, wo diese verfügbar sind.",
          sections: [
            ["1. Über diese App", "<p>Snake 3D (com.biemtech.snake3d) ist ein 3D-Arcade-Spiel für Personen ab 13 Jahren. Diese Erklärung gilt für Version 2.1.0 und spätere Versionen.</p><p>Äpfel, die Spielwährung, werden ausschließlich durch Spielen oder freiwilliges Ansehen von Videos verdient. Es gibt keine In-App-Käufe oder Transaktionen mit echtem Geld.</p>"],
            ["2. Welche Informationen wir erheben", "<p>Ein Konto oder eine Anmeldung ist nicht erforderlich. Es gibt keinen Chat, keine nutzergenerierten Inhalte, kein Analyse-SDK (einschließlich Firebase oder Google Analytics) und kein SDK für Absturzberichte. Einstellungen, Fortschritt und Statistiken bleiben auf dem Gerät und werden niemals an BieMTech gesendet.</p><p>Das Werbe-SDK von Google kann wie unten beschrieben Daten erheben und verarbeiten. BieMTech erhält nur zusammengefasste Werbeberichte von AdMob, keine personenbezogenen Daten, und verkauft keine personenbezogenen Daten.</p>"],
            ["3. Werbung (Google AdMob)", "<p>Das Spiel bietet ausschließlich freiwillige Belohnungsvideos, deren Wiedergabe du selbst wählst, etwa zum Wiederbeleben, Verdoppeln von Äpfeln, Erhalten kostenloser Gegenstände oder Testen eines Shop-Gegenstands für einen Durchlauf. Es gibt keine Banner- oder Interstitial-Anzeigen. Die Werbung wird von Google AdMob (Google Mobile Ads SDK) bereitgestellt; der Inhalt ist auf die Einstufung „T“ (Teenager) begrenzt. Anzeigenanfragen werden als nicht an Kinder gerichtet gekennzeichnet.</p><p>Das Google-SDK kann die Werbe-ID, IP-Adresse und daraus abgeleiteten ungefähren Standort, Geräte- und App-Informationen, Anzeigeninteraktionen sowie Diagnose-/Leistungsdaten erheben und verarbeiten. Zwecke sind Auslieferung und Messung von Werbung, Begrenzung der Anzeigehäufigkeit, Betrugsprävention und Sicherheit sowie Werbeanalysen. Daten werden bei der Übertragung verschlüsselt.</p><p>Wo eine Einwilligung erforderlich ist, werden personalisierte Anzeigen nur mit Einwilligung gezeigt; andernfalls kann Google nicht personalisierte oder eingeschränkte Anzeigen zeigen.</p><p>Googles Datenschutzinformationen: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Du kannst die Werbe-ID in den Android-Einstellungen &gt; Datenschutz &gt; Werbung zurücksetzen oder löschen; die Bezeichnungen variieren je nach Gerät.</p>"],
            ["4. Deine Datenschutzoptionen und Einwilligung", "<p>Im EWR, im Vereinigten Königreich und in der Schweiz zeigt die App vor der Anzeigenanfrage Googles Einwilligungsformular (Google User Messaging Platform). In bestimmten US-Bundesstaaten erscheint ein Hinweis, über den Nutzer dem „Verkauf“ oder der „Weitergabe“ personenbezogener Informationen widersprechen können.</p><p>Du kannst deine Auswahl jederzeit im Spiel unter Einstellungen &gt; „Datenschutzoptionen“ ändern oder widerrufen. Dieser Punkt erscheint dort, wo das Gesetz es verlangt.</p><p>Je nach anwendbarer DSGVO oder US-Bundesstaatsgesetzgebung können deine Rechte Auskunft, Löschung, Widerspruch, Widerruf der Einwilligung und Ablehnung von Verkauf oder Weitergabe umfassen. Anfragen zu Werbedaten laufen über Googles Werkzeuge; du kannst uns auch unter info@biemtech.com schreiben.</p>"],
            ["5. Kinder (13+)", "<p>Snake 3D richtet sich an Personen ab 13 Jahren und nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine personenbezogenen Informationen von Kindern unter 13 Jahren. Eltern, die vermuten, dass ihr Kind Daten bereitgestellt hat, können uns unter info@biemtech.com kontaktieren.</p>"],
            ["6. Internetzugang und Berechtigungen", "<p>Das Spiel ist vollständig offline spielbar. Internet wird nur zum Laden von Werbung und Einwilligungsformular verwendet; offline werden die Video-Schaltflächen ausgeblendet.</p><p>Android-Berechtigungen:</p><ul><li><code>INTERNET</code> und <code>ACCESS_NETWORK_STATE</code>, hinzugefügt durch das Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> für die Werbe-ID.</li><li><code>VIBRATE</code> für optionales haptisches Feedback.</li></ul><p>Die App fordert keine Berechtigungen für Standort, Kamera, Mikrofon, Kontakte, Fotos/Medien, Speicher oder Benachrichtigungen an.</p>"],
            ["7. Teilen und Links zu Google Play", "<p>Teilen-Schaltflächen öffnen das Android-Systemmenü zum Teilen mit einem kurzen Text (Punktestand, Level, Erfolgsname oder Spielname) und einem Google-Play-Link. Der Link enthält eine Herkunftsmarkierung (utm_source / utm_medium), damit Google Play berichten kann, welche Teilen-Schaltfläche einen Besuch ausgelöst hat; er enthält keine personenbezogenen Daten. Du wählst App und Empfänger. Snake 3D greift nicht auf Kontakte zu und sieht nicht, was gesendet wird.</p><p>„Weitere Spiele“ und „Bewerte uns“ öffnen Google-Play-Seiten, auf denen die eigene Datenschutzerklärung von Google Play gilt.</p>"],
            ["8. Auf deinem Gerät gespeicherte Daten", "<p>Folgende Daten werden ausschließlich auf deinem Gerät gespeichert und niemals an BieMTech gesendet:</p><ul><li>Optionen: Ton, Musik, Vibration, Grafikqualität und Sprache.</li><li>Fortschritt: Bestwert, aktuelles Level, Äpfel (Spielwährung), gekaufte und ausgerüstete Shop-Gegenstände sowie Booster.</li><li>Tägliche Aufgabe, täglicher Geschenkkalender, Erfolge und Status der täglichen Herausforderung.</li><li>Statistiken: gespielte Partien, gefressene Äpfel, längste Schlange, beste Kombo, Spielzeit, gefangene goldene Vögel, abgeschlossene Level, 3-Sterne-Level, gewonnene Herausforderungen, Zeitangriff-Bestwert und Spieltage.</li><li>Eine kleine lokale Markierung, die Musik nach einem audiobedingten Absturz abschaltet.</li></ul>"],
            ["9. Aufbewahrung und Löschung von Daten", "<p>Lokale Spieldaten bleiben auf deinem Gerät, bis du den App-Speicher in den Android-Einstellungen löschst oder die App deinstallierst. BieMTech erhält diese lokalen Daten nicht. Für Auskunft oder Löschung zu von Google verarbeiteten Werbedaten nutze Googles Werkzeuge; du kannst uns auch per E-Mail kontaktieren.</p>"],
            ["10. Änderungen dieser Erklärung", "<p>Wir können diese Erklärung aktualisieren, wenn sich die App oder ihre Datenverarbeitung ändert. Änderungen erscheinen auf dieser Seite mit einem neuen Aktualisierungsdatum.</p>"],
            ["11. Kontakt", "<p>Bei Fragen zu dieser Erklärung oder zur Datenverarbeitung von Snake 3D kontaktiere BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        fr: {
          dir: "ltr", back: "← Politiques de confidentialité BieMTech", subtitle: "Politique de confidentialité", audience: "À partir de 13 ans", rights: "Tous droits réservés.", app: "Application", pkg: "Package", updated: "Dernière mise à jour", date: "3 novembre 2026",
          summary: "<strong>Résumé :</strong> Aucun compte requis ; les données du jeu restent sur votre appareil. Les vidéos publicitaires récompensées facultatives de Google AdMob peuvent utiliser l’identifiant publicitaire et des données de l’appareil. Vous pouvez modifier vos choix dans Paramètres &gt; « Options de confidentialité », lorsque cette option est disponible.",
          sections: [
            ["1. À propos de cette application", "<p>Snake 3D (com.biemtech.snake3d) est un jeu d’arcade 3D destiné aux personnes de 13 ans et plus. Cette politique s’applique à la version 2.1.0 et aux versions ultérieures.</p><p>Les pommes, monnaie du jeu, s’obtiennent uniquement en jouant ou en regardant des vidéos facultatives. Il n’y a ni achats intégrés ni transactions en argent réel.</p>"],
            ["2. Informations que nous recueillons", "<p>Aucun compte ni connexion n’est nécessaire. Il n’y a ni chat, ni contenu généré par les utilisateurs, ni SDK d’analyse (y compris Firebase ou Google Analytics), ni SDK de rapport de plantage. Les paramètres, la progression et les statistiques restent sur votre appareil et ne sont jamais envoyés à BieMTech.</p><p>Le SDK publicitaire de Google peut recueillir et traiter des données comme décrit ci-dessous. BieMTech reçoit uniquement des rapports publicitaires agrégés d’AdMob, sans données personnelles, et ne vend pas de données personnelles.</p>"],
            ["3. Publicité (Google AdMob)", "<p>Le jeu propose uniquement des vidéos publicitaires récompensées facultatives que vous choisissez de regarder, par exemple pour revivre, doubler les pommes, obtenir des objets gratuits ou essayer un objet de la boutique pendant une partie. Il n’y a ni bannières ni publicités interstitielles. Les publicités sont diffusées par Google AdMob (Google Mobile Ads SDK), avec un contenu limité à la classification « T » (adolescents). Les demandes publicitaires sont marquées comme non destinées aux enfants.</p><p>Le SDK de Google peut recueillir et traiter l’identifiant publicitaire, l’adresse IP et la localisation approximative qui en découle, des informations sur l’appareil et l’application, les interactions avec les publicités et des données de diagnostic/performance. Les finalités sont la diffusion et la mesure des publicités, le plafonnement de leur fréquence, la prévention de la fraude et la sécurité, ainsi que l’analyse publicitaire. Les données sont chiffrées en transit.</p><p>Là où le consentement est requis, les publicités personnalisées ne sont diffusées qu’avec ce consentement ; sinon, Google peut diffuser des publicités non personnalisées ou limitées.</p><p>Informations de confidentialité de Google : <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Vous pouvez réinitialiser ou supprimer l’identifiant publicitaire dans les Paramètres Android &gt; Confidentialité &gt; Annonces ; les intitulés varient selon l’appareil.</p>"],
            ["4. Vos choix de confidentialité et votre consentement", "<p>Dans l’EEE, au Royaume-Uni et en Suisse, l’application affiche le formulaire de consentement de Google (Google User Messaging Platform) avant de demander des publicités. Dans certains États américains, un avis permet de refuser la « vente » ou le « partage » d’informations personnelles.</p><p>Vous pouvez modifier ou retirer vos choix à tout moment dans le jeu, sous Paramètres &gt; « Options de confidentialité », affichées lorsque la loi l’exige.</p><p>Selon le RGPD ou la législation de l’État américain applicable, vos droits peuvent inclure l’accès, l’effacement, l’opposition, le retrait du consentement et le refus de la vente ou du partage. Les demandes concernant les données publicitaires passent par les outils de Google ; vous pouvez aussi nous écrire à info@biemtech.com.</p>"],
            ["5. Enfants (13+)", "<p>Snake 3D s’adresse aux personnes de 13 ans et plus et ne vise pas les enfants de moins de 13 ans. Nous ne recueillons pas sciemment d’informations personnelles auprès d’enfants de moins de 13 ans. Un parent qui pense que son enfant a fourni des données peut nous contacter à info@biemtech.com.</p>"],
            ["6. Accès à Internet et autorisations", "<p>Le jeu est entièrement jouable hors ligne. Internet sert uniquement à charger les publicités et le formulaire de consentement ; hors ligne, les boutons vidéo sont masqués.</p><p>Autorisations Android :</p><ul><li><code>INTERNET</code> et <code>ACCESS_NETWORK_STATE</code>, ajoutées par Google Mobile Ads SDK.</li><li><code>com.google.android.gms.permission.AD_ID</code> pour l’identifiant publicitaire.</li><li><code>VIBRATE</code> pour le retour haptique facultatif.</li></ul><p>L’application ne demande aucune autorisation de localisation, caméra, microphone, contacts, photos/médias, stockage ou notifications.</p>"],
            ["7. Partage et liens vers Google Play", "<p>Les boutons de partage ouvrent la feuille de partage du système Android avec un court texte (score, niveau, nom d’un succès ou du jeu) et un lien Google Play. Ce lien contient une balise de provenance (utm_source / utm_medium) permettant à Google Play d’indiquer quel bouton de partage a amené une visite ; il ne contient aucune donnée personnelle. Vous choisissez l’application et le destinataire. Snake 3D n’accède pas aux contacts et ne voit pas ce qui est envoyé.</p><p>« Plus de jeux » et « Évaluez-nous » ouvrent des pages Google Play, où s’applique la politique de confidentialité propre à Google Play.</p>"],
            ["8. Données stockées sur votre appareil", "<p>Les données suivantes sont stockées uniquement sur votre appareil et ne sont jamais envoyées à BieMTech :</p><ul><li>Options : son, musique, vibrations, qualité graphique et langue.</li><li>Progression : meilleur score, niveau actuel, pommes (monnaie du jeu), objets de boutique possédés et équipés, et bonus.</li><li>Quête quotidienne, calendrier de cadeaux quotidiens, succès et état du défi quotidien.</li><li>Statistiques : parties jouées, pommes mangées, serpent le plus long, meilleur combo, temps de jeu, oiseaux dorés capturés, niveaux terminés, niveaux à 3 étoiles, défis gagnés, meilleur résultat contre-la-montre et jours joués.</li><li>Un petit marqueur local qui désactive la musique après un plantage lié à l’audio.</li></ul>"],
            ["9. Conservation et suppression des données", "<p>Les données locales restent sur votre appareil jusqu’à ce que vous effaciez le stockage de l’application dans les Paramètres Android ou la désinstalliez. BieMTech ne reçoit pas ces données locales. Pour demander l’accès aux données publicitaires traitées par Google ou leur suppression, utilisez les outils de Google ; vous pouvez aussi nous écrire.</p>"],
            ["10. Modifications de cette politique", "<p>Nous pouvons mettre à jour cette politique si l’application ou ses pratiques de traitement des données changent. Les mises à jour apparaîtront sur cette page avec une nouvelle date de dernière mise à jour.</p>"],
            ["11. Nous contacter", "<p>Pour toute question sur cette politique ou les pratiques de données de Snake 3D, contactez BieMTech :</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        tr: {
          dir: "ltr", back: "← BieMTech Gizlilik Politikaları", subtitle: "Gizlilik Politikası", audience: "13 yaş ve üzeri için", rights: "Tüm hakları saklıdır.", app: "Uygulama", pkg: "Paket", updated: "Son güncelleme", date: "3 Kasım 2026",
          summary: "<strong>Kısa özet:</strong> Hesap gerekmez; oyun verileri cihazınızda kalır. Google AdMob’un isteğe bağlı ödüllü video reklamları reklam kimliğini ve cihaz verilerini kullanabilir. Seçimlerinizi sunulduğu yerlerde Ayarlar &gt; “Gizlilik seçenekleri” bölümünden değiştirebilirsiniz.",
          sections: [
            ["1. Bu Uygulama Hakkında", "<p>Snake 3D (com.biemtech.snake3d), 13 yaş ve üzeri oyuncular için bir 3D arcade oyunudur. Bu politika 2.1.0 ve sonraki sürümler için geçerlidir.</p><p>Oyun para birimi olan elmalar yalnızca oynayarak veya isteğe bağlı videolar izleyerek kazanılır. Uygulama içi satın alma veya gerçek parayla işlem yoktur.</p>"],
            ["2. Topladığımız Bilgiler", "<p>Hesap veya giriş gerekmez. Sohbet, kullanıcıların oluşturduğu içerik, analiz SDK’sı (Firebase veya Google Analytics dahil) ya da çökme raporlama SDK’sı yoktur. Oyun ayarları, ilerleme ve istatistikler cihazınızda kalır ve BieMTech’e asla gönderilmez.</p><p>Google’ın reklam SDK’sı aşağıda açıklanan verileri toplayıp işleyebilir. BieMTech yalnızca AdMob’un toplu reklam raporlarını alır, kişisel veri almaz ve kişisel veri satmaz.</p>"],
            ["3. Reklamlar (Google AdMob)", "<p>Oyunda yalnızca kendi seçiminizle izlediğiniz isteğe bağlı ödüllü video reklamları bulunur; örneğin yeniden canlanmak, elmaları ikiye katlamak, ücretsiz oyun eşyaları almak veya bir mağaza eşyasını tek oyun boyunca denemek için. Banner veya geçiş reklamları yoktur. Reklamlar Google AdMob (Google Mobile Ads SDK) tarafından sunulur ve içerikleri “T” (Genç) derecelendirmesiyle sınırlandırılır. Reklam istekleri çocuklara yönelik değil olarak işaretlenir.</p><p>Google SDK’sı reklam kimliğini, IP adresini ve bundan çıkarılan yaklaşık konumu, cihaz ve uygulama bilgilerini, reklam etkileşim verilerini ve tanılama/performans verilerini toplayıp işleyebilir. Amaçlar reklam sunma ve ölçme, gösterim sıklığını sınırlama, dolandırıcılığı önleme ve güvenlik ile reklam analizidir. Veriler aktarım sırasında şifrelenir.</p><p>Onay gereken yerlerde kişiselleştirilmiş reklamlar yalnızca onayla gösterilir; aksi halde Google kişiselleştirilmemiş veya sınırlı reklamlar gösterebilir.</p><p>Google’ın gizlilik bilgileri: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Reklam kimliğini Android Ayarları &gt; Gizlilik &gt; Reklamlar bölümünden sıfırlayabilir veya silebilirsiniz; adlandırma cihaza göre değişir.</p>"],
            ["4. Gizlilik Seçimleriniz ve Onayınız", "<p>AEA, Birleşik Krallık ve İsviçre’de uygulama, reklam istemeden önce Google’ın onay formunu (Google User Messaging Platform) gösterir. ABD’nin bazı eyaletlerinde kullanıcılara kişisel bilgilerin “satışından” veya “paylaşımından” çıkmalarını sağlayan bir bildirim gösterilir.</p><p>Seçimlerinizi oyun içinde Ayarlar &gt; “Gizlilik seçenekleri” bölümünden istediğiniz zaman değiştirebilir veya geri çekebilirsiniz. Bu bölüm yasaların gerektirdiği yerlerde gösterilir.</p><p>Geçerli GDPR veya ABD eyalet yasasına bağlı olarak erişim, silme, itiraz, onayı geri çekme ve satış ya da paylaşımdan çıkma haklarınız olabilir. Reklam verileriyle ilgili talepler Google’ın araçları üzerinden yapılır; info@biemtech.com adresinden bize de yazabilirsiniz.</p>"],
            ["5. Çocuklar (13+)", "<p>Snake 3D, 13 yaş ve üzeri içindir; 13 yaş altındaki çocuklara yönelik değildir. 13 yaş altındaki çocuklardan bilerek kişisel bilgi toplamayız. Çocuğunun veri sağladığını düşünen bir ebeveyn info@biemtech.com üzerinden bizimle iletişime geçebilir.</p>"],
            ["6. İnternet Erişimi ve İzinler", "<p>Oyun tamamen çevrimdışı oynanabilir. İnternet yalnızca reklamları ve onay formunu yüklemek için kullanılır; çevrimdışıyken video düğmeleri gizlenir.</p><p>Android izinleri:</p><ul><li>Google Mobile Ads SDK tarafından eklenen <code>INTERNET</code> ve <code>ACCESS_NETWORK_STATE</code>.</li><li>Reklam kimliği için <code>com.google.android.gms.permission.AD_ID</code>.</li><li>İsteğe bağlı dokunsal geri bildirim için <code>VIBRATE</code>.</li></ul><p>Uygulama konum, kamera, mikrofon, kişiler, fotoğraf/medya, depolama veya bildirim izni istemez.</p>"],
            ["7. Paylaşım ve Google Play Bağlantıları", "<p>Paylaş düğmeleri kısa bir metin (skor, seviye, başarı adı veya oyun adı) ve Google Play bağlantısıyla Android’in sistem paylaşım sayfasını açar. Bağlantı, Google Play’in hangi paylaş düğmesinin ziyaret getirdiğini raporlayabilmesi için bir yönlendirme etiketi (utm_source / utm_medium) içerir; kişisel veri içermez. Uygulamayı ve alıcıyı siz seçersiniz. Snake 3D kişilere erişmez ve gönderilenleri görmez.</p><p>“Daha fazla oyun” ve “Bizi değerlendirin”, Google Play’in kendi gizlilik politikasının geçerli olduğu Google Play sayfalarını açar.</p>"],
            ["8. Cihazınızda Saklanan Veriler", "<p>Aşağıdaki veriler yalnızca cihazınızda saklanır ve BieMTech’e asla gönderilmez:</p><ul><li>Seçenekler: ses, müzik, titreşim, grafik kalitesi ve dil.</li><li>İlerleme: en iyi skor, mevcut seviye, elmalar (oyun para birimi), sahip olunan ve takılan mağaza eşyaları ve güçlendiriciler.</li><li>Günlük görev, günlük hediye takvimi, başarılar ve günlük meydan okuma durumu.</li><li>İstatistikler: oynanan oyunlar, yenilen elmalar, en uzun yılan, en iyi kombo, oyun süresi, yakalanan altın kuşlar, tamamlanan seviyeler, 3 yıldızlı seviyeler, kazanılan meydan okumalar, zamana karşı en iyi sonuç ve oynanan günler.</li><li>Sesle ilgili bir çökmeden sonra müziği kapatan küçük bir yerel işaret.</li></ul>"],
            ["9. Verilerin Saklanması ve Silinmesi", "<p>Yerel oyun verileri, Android Ayarları’ndan uygulamanın depolama alanını temizleyene veya uygulamayı kaldırana kadar cihazınızda kalır. BieMTech bu yerel verileri almaz. Google’ın işlediği reklam verilerine erişim veya bunların silinmesi için Google’ın araçlarını kullanın; bize e-posta da gönderebilirsiniz.</p>"],
            ["10. Bu Politikadaki Değişiklikler", "<p>Uygulama veya veri uygulamaları değiştiğinde bu politikayı güncelleyebiliriz. Güncellemeler bu sayfada yeni bir son güncelleme tarihiyle yayımlanır.</p>"],
            ["11. Bize Ulaşın", "<p>Bu politika veya Snake 3D’nin veri uygulamalarıyla ilgili sorularınız için BieMTech ile iletişime geçin:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        az: {
          dir: "ltr", back: "← BieMTech Məxfilik Siyasətləri", subtitle: "Məxfilik Siyasəti", audience: "13 yaş və yuxarı üçün", rights: "Bütün hüquqlar qorunur.", app: "Tətbiq", pkg: "Paket", updated: "Son yenilənmə", date: "3 noyabr 2026",
          summary: "<strong>Qısa xülasə:</strong> Hesab tələb olunmur; oyun məlumatları cihazınızda qalır. Google AdMob-un istəyə bağlı mükafatlı video reklamları reklam identifikatorundan və cihaz məlumatlarından istifadə edə bilər. Seçimlərinizi mövcud olduğu yerlərdə Parametrlər &gt; “Məxfilik seçimləri” bölməsindən dəyişə bilərsiniz.",
          sections: [
            ["1. Bu Tətbiq Haqqında", "<p>Snake 3D (com.biemtech.snake3d) 13 yaş və yuxarı oyunçular üçün 3D arkada oyunudur. Bu siyasət 2.1.0 və sonrakı versiyalara aiddir.</p><p>Oyundaxili valyuta olan almalar yalnız oynamaqla və ya istəyə bağlı videolara baxmaqla qazanılır. Tətbiqdaxili alışlar və real pulla əməliyyatlar yoxdur.</p>"],
            ["2. Topladığımız Məlumatlar", "<p>Hesab və ya giriş tələb olunmur. Çat, istifadəçilərin yaratdığı məzmun, analitika SDK-sı (Firebase və ya Google Analytics daxil olmaqla) və xəta hesabatı SDK-sı yoxdur. Oyun parametrləri, irəliləyiş və statistika cihazınızda qalır və heç vaxt BieMTech-ə göndərilmir.</p><p>Google-un reklam SDK-sı aşağıda göstərilən məlumatları toplayıb emal edə bilər. BieMTech yalnız AdMob-un ümumiləşdirilmiş reklam hesabatlarını alır, şəxsi məlumat almır və şəxsi məlumatları satmır.</p>"],
            ["3. Reklamlar (Google AdMob)", "<p>Oyunda yalnız öz seçiminizlə baxdığınız istəyə bağlı mükafatlı video reklamları var; məsələn, yenidən canlanmaq, almaları ikiqat artırmaq, pulsuz oyundaxili əşyalar əldə etmək və ya mağaza əşyasını bir oyun ərzində sınamaq üçün. Banner və keçid reklamları yoxdur. Reklamlar Google AdMob (Google Mobile Ads SDK) tərəfindən təqdim olunur və məzmunları “T” (Yeniyetmə) reytinqi ilə məhdudlaşdırılır. Reklam sorğuları uşaqlara yönəlməyən kimi işarələnir.</p><p>Google SDK-sı reklam identifikatorunu, IP ünvanını və ondan müəyyənləşdirilən təxmini məkanı, cihaz və tətbiq məlumatlarını, reklamla qarşılıqlı əlaqə məlumatlarını və diaqnostika/performans məlumatlarını toplayıb emal edə bilər. Məqsədlər reklamların göstərilməsi və ölçülməsi, göstərilmə tezliyinin məhdudlaşdırılması, fırıldaqçılığın qarşısının alınması və təhlükəsizlik, eləcə də reklam analitikasıdır. Məlumatlar ötürülmə zamanı şifrələnir.</p><p>Razılıq tələb olunan yerlərdə fərdiləşdirilmiş reklamlar yalnız razılıqla göstərilir; əks halda Google fərdiləşdirilməmiş və ya məhdud reklamlar göstərə bilər.</p><p>Google-un məxfilik məlumatları: <a href=\"https://policies.google.com/privacy\">Google</a> · <a href=\"https://policies.google.com/technologies/partner-sites\">Google AdMob</a>.</p><p>Reklam identifikatorunu Android Parametrləri &gt; Məxfilik &gt; Reklamlar bölməsində sıfırlaya və ya silə bilərsiniz; adlandırma cihazdan asılı olaraq dəyişir.</p>"],
            ["4. Məxfilik Seçimləriniz və Razılığınız", "<p>Avropa İqtisadi Məkanında (AİM), Birləşmiş Krallıqda və İsveçrədə tətbiq reklam sorğusundan əvvəl Google-un razılıq formasını (Google User Messaging Platform) göstərir. ABŞ-ın bəzi ştatlarında istifadəçilərə şəxsi məlumatların “satışı” və ya “paylaşılması”ndan imtina etməyə imkan verən bildiriş göstərilir.</p><p>Seçimlərinizi oyunda Parametrlər &gt; “Məxfilik seçimləri” bölməsindən istənilən vaxt dəyişə və ya geri götürə bilərsiniz. Bu bölmə qanunun tələb etdiyi yerlərdə göstərilir.</p><p>Tətbiq olunan GDPR və ya ABŞ ştat qanunlarından asılı olaraq məlumatlara çıxış, silinmə, etiraz, razılığı geri götürmə və satışdan və ya paylaşılmadan imtina hüquqlarınız ola bilər. Reklam məlumatlarına dair sorğular Google-un alətləri vasitəsilə verilir; info@biemtech.com ünvanına da yaza bilərsiniz.</p>"],
            ["5. Uşaqlar (13+)", "<p>Snake 3D 13 yaş və yuxarı üçündür və 13 yaşdan kiçik uşaqlara yönəlməyib. 13 yaşdan kiçik uşaqlardan bilərəkdən şəxsi məlumat toplamırıq. Övladının məlumat təqdim etdiyini düşünən valideyn info@biemtech.com vasitəsilə bizimlə əlaqə saxlaya bilər.</p>"],
            ["6. İnternetə Çıxış və İcazələr", "<p>Oyun tam şəkildə oflayn oynanıla bilər. İnternet yalnız reklamları və razılıq formasını yükləmək üçün istifadə olunur; oflayn olduqda video düymələri gizlədilir.</p><p>Android icazələri:</p><ul><li>Google Mobile Ads SDK tərəfindən əlavə olunan <code>INTERNET</code> və <code>ACCESS_NETWORK_STATE</code>.</li><li>Reklam identifikatoru üçün <code>com.google.android.gms.permission.AD_ID</code>.</li><li>İstəyə bağlı toxunma reaksiyası üçün <code>VIBRATE</code>.</li></ul><p>Tətbiq məkan, kamera, mikrofon, kontaktlar, şəkillər/media, yaddaş və ya bildiriş icazələri istəmir.</p>"],
            ["7. Paylaşma və Google Play Keçidləri", "<p>Paylaş düymələri qısa mətn (xal, səviyyə, nailiyyətin adı və ya oyunun adı) və Google Play keçidi ilə Android-in sistem paylaşma panelini açır. Google Play-in hansı paylaş düyməsinin ziyarət gətirdiyini hesabatda göstərə bilməsi üçün keçiddə yönləndirmə etiketi (utm_source / utm_medium) olur; o, şəxsi məlumat ehtiva etmir. Tətbiqi və alıcını siz seçirsiniz. Snake 3D kontaktlara çıxış əldə etmir və göndərilənləri görmür.</p><p>“Daha çox oyun” və “Bizi qiymətləndirin” Google Play səhifələrini açır; həmin səhifələrdə Google Play-in öz məxfilik siyasəti tətbiq olunur.</p>"],
            ["8. Cihazınızda Saxlanan Məlumatlar", "<p>Aşağıdakı məlumatlar yalnız cihazınızda saxlanılır və heç vaxt BieMTech-ə göndərilmir:</p><ul><li>Seçimlər: səs, musiqi, vibrasiya, qrafika keyfiyyəti və dil.</li><li>İrəliləyiş: ən yaxşı xal, cari səviyyə, almalar (oyundaxili valyuta), sahib olduğunuz və taxdığınız mağaza əşyaları və gücləndiricilər.</li><li>Gündəlik tapşırıq, gündəlik hədiyyə təqvimi, nailiyyətlər və gündəlik çağırışın vəziyyəti.</li><li>Statistika: oynanılan oyunlar, yeyilən almalar, ən uzun ilan, ən yaxşı kombo, oyun vaxtı, tutulan qızıl quşlar, tamamlanan səviyyələr, 3 ulduzlu səviyyələr, qazanılan çağırışlar, vaxta qarşı rejimdə ən yaxşı nəticə və oynanılan günlər.</li><li>Səslə bağlı xətadan sonra musiqini söndürən kiçik lokal işarə.</li></ul>"],
            ["9. Məlumatların Saxlanması və Silinməsi", "<p>Lokal oyun məlumatları Android Parametrlərində tətbiqin yaddaşını təmizləyənə və ya tətbiqi silənə qədər cihazınızda qalır. BieMTech bu lokal məlumatları almır. Google-un emal etdiyi reklam məlumatlarına çıxış və ya onların silinməsi üçün Google-un alətlərindən istifadə edin; bizə e-poçt da göndərə bilərsiniz.</p>"],
            ["10. Bu Siyasətə Dəyişikliklər", "<p>Tətbiq və ya məlumatların emalı qaydaları dəyişdikdə bu siyasəti yeniləyə bilərik. Yeniliklər bu səhifədə yeni son yenilənmə tarixi ilə göstəriləcək.</p>"],
            ["11. Bizimlə Əlaqə", "<p>Bu siyasət və ya Snake 3D-nin məlumatların emalı qaydaları ilə bağlı suallar üçün BieMTech ilə əlaqə saxlayın:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        }
      };

      function render(lang) {
        const t = T[lang] || T.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent = t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent = t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.getElementById("policy-content").innerHTML = `
          <p class="meta">
            ${t.app}: <strong>Snake 3D</strong> &nbsp;|&nbsp;
            ${t.pkg}: <code>com.biemtech.snake3d</code> &nbsp;|&nbsp;
            ${t.updated}: <strong>${t.date}</strong>
          </p>
          <div class="summary">✓ ${t.summary}</div>
          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }

      function switchLang(lang) {
        render(lang);
        try { localStorage.setItem("site_lang", lang); } catch (_) {}
      }

      (function initLanguage() {
        let saved = "";
        try { saved = localStorage.getItem("site_lang") || ""; } catch (_) {}
        const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
        const lang = T[saved] ? saved : T[browserLang] ? browserLang : "en";
        document.getElementById("lang-select").value = lang;
        render(lang);
      })();
    </script>
  </body>
</html>
