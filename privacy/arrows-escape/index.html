      function render(lang) {
        const t = T[lang] || T.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent =
          t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent =
          t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;

        document.getElementById("policy-content").innerHTML = `
          <p class="meta">
            ${t.app}: <strong>Arrows Escape</strong> &nbsp;|&nbsp;
            ${t.pkg}: <code>com.biemtech.arrowsescape</code> &nbsp;|&nbsp;
            ${t.updated}: <strong>${t.date}</strong>
          </p>
          <div class="summary">✓ ${t.summary}</div>
          ${t.sections
            .map(
              (section) => `
                <section class="card">
                  <h2>${section.title}</h2>
                  ${section.body}
                </section>
              `,
            )
            .join("")}
        `;
      }

      function switchLang(lang) {
        render(lang);
        try {
          localStorage.setItem("site_lang", lang);
        } catch (error) {}
      }

      (function initLanguage() {
        let saved = "";
        try {
          saved = localStorage.getItem("site_lang") || "";
        } catch (error) {}
        const browserLang = (navigator.language || "en").slice(0, 2);
        const lang = T[saved] ? saved : T[browserLang] ? browserLang : "en";
        document.getElementById("lang-select").value = lang;
        render(lang);
      })();
    </script>
  </body>
