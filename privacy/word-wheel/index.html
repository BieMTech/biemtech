<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy — Word Wheel | BieMTech</title>
    <meta name="description" content="Privacy Policy for Word Wheel by BieMTech. The current build keeps game progress on the device and does not collect or share personal data." />
    <link rel="icon" type="image/png" href="../../img/word-wheel-icon.png" />
    <style>
      :root { --emerald:#087b68; --deep:#08263a; --gold:#d99b13; --coral:#cf6e52; --bg:#eef7f3; --card:rgba(255,255,255,.91); --text:#172b2c; --muted:#4b6462; --dim:#758783; --border:rgba(8,123,104,.14); }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text); background: radial-gradient(circle at 10% 7%, rgba(57,198,166,.22), transparent 27rem), radial-gradient(circle at 90% 40%, rgba(239,129,94,.14), transparent 24rem), linear-gradient(180deg,#f6faf6,var(--bg)); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.65; }
      header { padding:34px 20px 30px; text-align:center; border-bottom:1px solid var(--border); background:rgba(246,250,246,.87); backdrop-filter:blur(18px); }
      .top { display:flex; align-items:center; justify-content:space-between; max-width:900px; margin:0 auto 26px; gap:16px; }
      .back { display:inline-flex; align-items:center; gap:9px; color:var(--muted); font-size:.85rem; font-weight:700; text-decoration:none; }
      .back img { width:30px; height:30px; border-radius:8px; }
      .lang-select { appearance:none; padding:8px 11px; color:var(--text); font:inherit; font-size:.82rem; font-weight:700; border:1px solid var(--border); border-radius:9px; background:rgba(255,255,255,.8); cursor:pointer; }
      .app-icon { width:88px; height:88px; margin-bottom:12px; border-radius:22px; box-shadow:0 14px 34px rgba(8,123,104,.2); }
      .eyebrow { margin:0 0 6px; color:var(--emerald); font-size:.75rem; font-weight:850; letter-spacing:.12em; text-transform:uppercase; }
      h1 { margin:0; color:var(--deep); font-size:clamp(2rem,6vw,3.25rem); line-height:1.1; letter-spacing:-.04em; }
      .audience { margin:12px 0 0; color:var(--muted); font-size:.9rem; font-weight:650; }
      main { width:min(820px,calc(100% - 36px)); margin:38px auto 50px; }
      .meta { margin:0 0 18px; padding:15px 18px; color:var(--muted); font-size:.83rem; border:1px solid var(--border); border-radius:13px; background:rgba(255,255,255,.7); overflow-wrap:anywhere; }
      .summary,.future-notice { margin-bottom:14px; padding:18px 20px; border-radius:14px; }
      .summary { color:#075344; border:1px solid rgba(8,123,104,.22); background:rgba(57,198,166,.17); }
      .future-notice { color:#634700; border:1px solid rgba(217,155,19,.25); background:rgba(247,189,59,.2); }
      .card { margin-top:14px; padding:24px 24px 21px; border:1px solid var(--border); border-radius:16px; background:var(--card); box-shadow:0 8px 24px rgba(8,38,58,.055); }
      .card h2 { margin:0 0 10px; color:var(--deep); font-size:1.05rem; line-height:1.35; }
      .card p { margin:0 0 10px; color:var(--muted); font-size:.93rem; }
      .card p:last-child { margin-bottom:0; }
      .card ul { margin:8px 0 10px; padding-left:24px; color:var(--muted); font-size:.93rem; }
      .contact-link { display:inline-block; margin-top:3px; color:var(--emerald); font-weight:750; }
      footer { padding:25px 20px; color:var(--dim); font-size:.82rem; text-align:center; border-top:1px solid var(--border); }
      footer a { color:var(--emerald); }
      [dir="rtl"] .card,[dir="rtl"] .summary,[dir="rtl"] .future-notice,[dir="rtl"] .meta { text-align:right; }
      [dir="rtl"] .card ul { padding-right:24px; padding-left:0; }
      @media (max-width:560px) { .top{align-items:flex-start}.back{max-width:190px;text-align:left}.card{padding:21px 19px 18px} }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <a class="back" href="../index.html"><img src="../../img/logo-biemtech.png" alt="" /><span data-i18n="back">← BieMTech Privacy Policies</span></a>
        <select id="lang-select" class="lang-select" onchange="switchLang(this.value)" aria-label="Language">
          <option value="en">🇬🇧 EN</option><option value="az">🇦🇿 AZ</option><option value="ru">🇷🇺 RU</option>
          <option value="tr">🇹🇷 TR</option><option value="de">🇩🇪 DE</option><option value="fr">🇫🇷 FR</option>
          <option value="es">🇪🇸 ES</option><option value="pt">🇵🇹 PT</option><option value="it">🇮🇹 IT</option>
          <option value="ar">🇸🇦 AR</option><option value="zh">🇨🇳 ZH</option><option value="ja">🇯🇵 JA</option>
        </select>
      </div>
      <img class="app-icon" src="../../img/word-wheel-icon.png" alt="Word Wheel" />
      <p class="eyebrow" data-i18n="subtitle">Privacy Policy</p>
      <h1>Word Wheel</h1>
      <p class="audience" data-i18n="audience">Recommended for ages 12+ · General-audience game</p>
    </header>
    <main id="policy-content"></main>
    <footer>&copy; <span id="year"></span> BieMTech · <span data-i18n="rights">All rights reserved.</span></footer>
    <script src="policy-i18n.js"></script>
    <script>
      function render(lang) {
        const t = WORD_WHEEL_POLICY[lang] || WORD_WHEEL_POLICY.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent = t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent = t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.getElementById("policy-content").innerHTML = `
          <p class="meta">${t.app}: <strong>Word Wheel</strong> &nbsp;|&nbsp; ${t.statusLabel}: <strong>${t.status}</strong> &nbsp;|&nbsp; ${t.updated}: <strong>${t.date}</strong></p>
          <div class="summary">✓ ${t.summary}</div>
          <div class="future-notice">ⓘ ${t.future}</div>
          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }
      function switchLang(lang) { if (!WORD_WHEEL_POLICY[lang]) lang="en"; try { localStorage.setItem("site_lang",lang); } catch (_) {} document.getElementById("lang-select").value=lang; render(lang); }
      document.getElementById("year").textContent=new Date().getFullYear();
      (function initLanguage(){ let saved=""; try{ saved=localStorage.getItem("site_lang")||""; }catch(_){} const browserLang=(navigator.language||"en").slice(0,2).toLowerCase(); const lang=WORD_WHEEL_POLICY[saved]?saved:WORD_WHEEL_POLICY[browserLang]?browserLang:"en"; document.getElementById("lang-select").value=lang; render(lang); })();
    </script>
  </body>
</html>
