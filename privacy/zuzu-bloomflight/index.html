<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy — Zuzu: Bloomflight | BieMTech</title>
    <meta name="description" content="Privacy Policy for Zuzu: Bloomflight by BieMTech. Core play works offline; optional Google Play Games features use Google services." />
    <link rel="icon" type="image/svg+xml" href="../../img/zuzu-bloomflight-icon.svg" />
    <style>
      :root {
        --leaf: #397b53;
        --leaf-dark: #173b2a;
        --honey: #e5a914;
        --rose: #d96b82;
        --bg: #eef6ed;
        --card: rgba(255,255,255,.9);
        --text: #1f2922;
        --muted: #506257;
        --dim: #738078;
        --border: rgba(35,92,58,.14);
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text); background: radial-gradient(circle at 12% 8%, rgba(255,224,138,.35), transparent 26rem), radial-gradient(circle at 88% 42%, rgba(156,130,216,.16), transparent 24rem), linear-gradient(180deg, #f4f8ef, var(--bg)); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.65; }
      header { padding: 34px 20px 30px; text-align: center; border-bottom: 1px solid var(--border); background: rgba(244,248,239,.86); backdrop-filter: blur(18px); }
      .top { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto 26px; gap: 16px; }
      .back { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: .85rem; font-weight: 700; text-decoration: none; }
      .back img { width: 30px; height: 30px; border-radius: 8px; }
      .lang-select { appearance: none; padding: 8px 11px; color: var(--text); font: inherit; font-size: .82rem; font-weight: 700; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.78); cursor: pointer; }
      .app-icon { width: 88px; height: 88px; margin-bottom: 12px; border-radius: 22px; box-shadow: 0 14px 34px rgba(46,111,64,.18); }
      .eyebrow { margin: 0 0 6px; color: var(--leaf); font-size: .75rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; color: var(--leaf-dark); font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; letter-spacing: -.04em; }
      .audience { margin: 12px 0 0; color: var(--muted); font-size: .9rem; font-weight: 650; }
      main { width: min(820px, calc(100% - 36px)); margin: 38px auto 50px; }
      .meta { margin: 0 0 18px; padding: 15px 18px; color: var(--muted); font-size: .83rem; border: 1px solid var(--border); border-radius: 13px; background: rgba(255,255,255,.68); overflow-wrap: anywhere; }
      code { color: var(--leaf-dark); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .summary, .future-notice { margin-bottom: 14px; padding: 18px 20px; border-radius: 14px; }
      .summary { color: #164728; border: 1px solid rgba(57,123,83,.22); background: rgba(143,217,168,.25); }
      .future-notice { color: #604600; border: 1px solid rgba(229,169,20,.25); background: rgba(255,224,138,.32); }
      .card { margin-top: 14px; padding: 24px 24px 21px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(23,59,42,.055); }
      .card h2 { margin: 0 0 10px; color: var(--leaf-dark); font-size: 1.05rem; line-height: 1.35; }
      .card p { margin: 0 0 10px; color: var(--muted); font-size: .93rem; }
      .card p:last-child { margin-bottom: 0; }
      .card ul { margin: 8px 0 10px; padding-left: 24px; color: var(--muted); font-size: .93rem; }
      .contact-link { display: inline-block; margin-top: 3px; color: var(--leaf); font-weight: 750; }
      footer { padding: 25px 20px; color: var(--dim); font-size: .82rem; text-align: center; border-top: 1px solid var(--border); }
      footer a { color: var(--leaf); }
      [dir="rtl"] .card, [dir="rtl"] .summary, [dir="rtl"] .future-notice, [dir="rtl"] .meta { text-align: right; }
      [dir="rtl"] .card ul { padding-right: 24px; padding-left: 0; }
      @media (max-width: 560px) { .top { align-items: flex-start; } .back { max-width: 190px; text-align: left; } .card { padding: 21px 19px 18px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="top">
        <a class="back" href="../index.html"><img src="../../img/logo-biemtech.png" alt="" /><span data-i18n="back">← BieMTech Privacy Policies</span></a>
        <select id="lang-select" class="lang-select" onchange="switchLang(this.value)" aria-label="Language">
          <option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇵🇹 PT</option>
          <option value="fr">🇫🇷 FR</option><option value="de">🇩🇪 DE</option><option value="ru">🇷🇺 RU</option>
          <option value="tr">🇹🇷 TR</option><option value="az">🇦🇿 AZ</option><option value="ar">🇸🇦 AR</option>
          <option value="hi">🇮🇳 HI</option><option value="id">🇮🇩 ID</option><option value="zh">🇨🇳 ZH</option>
        </select>
      </div>
      <img class="app-icon" src="../../img/zuzu-bloomflight-icon.svg" alt="Zuzu: Bloomflight" />
      <p class="eyebrow" data-i18n="subtitle">Privacy Policy</p>
      <h1>Zuzu: Bloomflight</h1>
      <p class="audience" data-i18n="audience">Recommended for ages 6+ · General-audience game</p>
    </header>
    <main id="policy-content"></main>
    <footer>&copy; <span id="year"></span> BieMTech · <span data-i18n="rights">All rights reserved.</span></footer>
    <script src="policy-i18n.js"></script>
    <script>
      function render(lang) {
        const t = ZUZU_POLICY[lang] || ZUZU_POLICY.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent = t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent = t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.getElementById("policy-content").innerHTML = `
          <p class="meta">${t.app}: <strong>Zuzu: Bloomflight</strong> &nbsp;|&nbsp; ${t.pkg}: <code>com.biemtech.zuzu</code> &nbsp;|&nbsp; ${t.updated}: <strong>${t.date}</strong></p>
          <div class="summary">✓ ${t.summary}</div>
          <div class="future-notice">ℹ ${t.futureAds}</div>
          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }
      function switchLang(lang) { if (!ZUZU_POLICY[lang]) lang = "en"; try { localStorage.setItem("site_lang", lang); } catch (_) {} document.getElementById("lang-select").value = lang; render(lang); }
      document.getElementById("year").textContent = new Date().getFullYear();
      (function initLanguage() { let saved = ""; try { saved = localStorage.getItem("site_lang") || ""; } catch (_) {} const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase(); const lang = ZUZU_POLICY[saved] ? saved : ZUZU_POLICY[browserLang] ? browserLang : "en"; document.getElementById("lang-select").value = lang; render(lang); })();
    </script>
  </body>
</html>
