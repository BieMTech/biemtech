            ["1. Über diese App", "<p>REX: Dragon Flight ist ein Ein-Tipp-Arcade-Spiel, in dem ein Cartoon-Drache durch Fantasywelten fliegt, Feuer auf Hindernisse speit, Power-ups sammelt und Rekorde jagt.</p><p>Das Spiel richtet sich an ein allgemeines Publikum und wird für <strong>Spieler ab 6 Jahren</strong> empfohlen. Es ist nicht ausschließlich für Kinder bestimmt.</p>"],
            ["2. Personenbezogene Daten und Google Play Games", "<p>REX: Dragon Flight <strong>fragt Name, E-Mail, Telefon, Standort, Kontakte, Fotos, Medien oder Zahlungsdaten nicht ab und erhebt sie nicht</strong>.</p><p>Wenn Sie Google Play Games oder die Online-Bestenliste nutzen, kann Google Konto, Spieler-ID, Profil und Punktestand nach eigenen Richtlinien verarbeiten. Das Spiel sendet Punkte und liest Einträge nur für diese optionale Funktion.</p>"],
            ["3. Nur auf dem Gerät gespeicherte Informationen", "<p>Lokal gespeichert werden:</p><ul><li>Bestwert, Anzahl der Spiele, verbrannte Hindernisse und weiteste Welt;</li><li>Sprache, Ton, Musik, optionale Vibration und heller Modus.</li></ul><p>Beim ersten Start kann die Gerätesprache lokal gelesen werden. Nichts verlässt das Gerät oder ist für BieMTech zugänglich.</p>"],
            ["4. Offline-Nutzung, Verbindung und Berechtigungen", "<p>Das Hauptspiel funktioniert offline. Internet wird nur für die optionale Google-Play-Games-Anmeldung und Bestenliste genutzt. Vibration kann für haptisches Feedback verwendet werden; Standort, Kamera, Mikrofon, Kontakte, Fotos, externer Speicher, Benachrichtigungen und andere sensible Rechte werden nicht angefordert.</p>"],
            ["5. Kinder und Altersempfehlung", "<p>Es gibt keine Registrierung, Chats, sozialen Profile, Nutzerinhalte, gezielte Werbung, Glücksspiele oder Käufe. Die Fantasy-Action zeigt einen Cartoon-Drachen, Feuer gegen unbelebte Hindernisse, nicht-grafische Explosionen und eine kurze Kollision ohne Blut.</p><p>BieMTech empfiehlt <strong>ab 6 Jahren</strong> und hält das Spiel für ein breites Publikum geeignet. Store-Einstufungen vergeben regionale Behörden separat.</p>"],
            ["6. Werbung, Analysen und Dritte", "<p>Die aktuelle Version enthält keine Werbung und keine Drittanbieter-SDKs für Analyse, Tracking, Fehlerberichte, Cloud-Speicher, soziale Netzwerke oder Käufe. Google Play Games ist die einzige optionale Online-Integration und unterliegt Googles Richtlinien. Google Play kann Store- und Gerätedaten separat verarbeiten.</p>"],
            ["7. Aufbewahrung, Sicherheit und Löschung", "<p>Lokale Einstellungen und Statistiken bleiben bis zur Löschung auf dem Gerät. Löschen Sie den App-Speicher in Android oder deinstallieren Sie die App. Da keine Daten an BieMTech gesendet werden, ist keine serverseitige Anfrage nötig.</p>"],

        ru: {
          dir: "ltr", back: "← Политики конфиденциальности BieMTech", subtitle: "Политика конфиденциальности", audience: "Рекомендуется с 6 лет · Подходит для всех возрастов", rights: "Все права защищены.", app: "Приложение", pkg: "Пакет", updated: "Последнее обновление", date: "30 августа 2026 г.",
          summary: "<strong>Кратко:</strong> REX: Dragon Flight хранит основной прогресс и настройки на устройстве и не продаёт персональные данные. Основная игра работает офлайн. Необязательные вход и рейтинг Google Play Games используют сервис Google только по вашему выбору. Рекламы, аналитики и покупок нет.",
          futureAds: "<strong>Планируемое изменение:</strong> В одной из будущих версий планируется добавить рекламу. В текущей версии реклама не активна. До выпуска версии с рекламой эта политика и декларации Google Play будут обновлены: в них будут указаны поставщики рекламы, описаны доступ, сбор или передача данных, а также необходимые меры согласия и защиты детей.",
          sections: [
            ["1. О приложении", "<p>REX: Dragon Flight — аркадная игра с управлением одним касанием: игрок ведёт мультяшного дракона через фантастические миры, дышит огнём на препятствия, собирает усиления и ставит рекорды.</p><p>Игра предназначена для широкой аудитории и рекомендуется <strong>с 6 лет</strong>. Она не создана исключительно для детей.</p>"],
            ["2. Персональные данные и Google Play Games", "<p>REX: Dragon Flight <strong>не запрашивает и не собирает</strong> имя, почту, телефон, местоположение, контакты, фотографии, медиа или платёжные данные.</p><p>Если вы выберете вход или онлайн-рейтинг Google Play Games, Google может обрабатывать аккаунт, идентификатор игрока, профиль и очки по своей политике. Игра отправляет очки и читает рейтинг только для этой необязательной функции.</p>"],
            ["3. Данные только на устройстве", "<p>Локально сохраняются:</p><ul><li>рекорд, число игр, сожжённые препятствия и самая дальняя открытая локация;</li><li>язык, звук, музыка, необязательная вибрация и яркий режим.</li></ul><p>При первом запуске язык устройства может быть прочитан локально для выбора интерфейса. Эти данные не покидают устройство и недоступны BieMTech.</p>"],
            ["4. Офлайн-работа, подключение и разрешения", "<p>Основная игра работает офлайн. Интернет используется только для необязательных входа и рейтинга Google Play Games. Игра может использовать вибрацию и не запрашивает местоположение, камеру, микрофон, контакты, фотографии, внешнее хранилище, уведомления или другие чувствительные разрешения.</p>"],
            ["5. Дети и возраст", "<p>Нет регистрации, чата, социальных профилей, пользовательского контента, целевой рекламы, азартных игр или покупок. Фэнтезийная сцена показывает мультяшного дракона, огонь по неживым препятствиям, неграфичные взрывы и короткое столкновение без крови.</p><p>BieMTech рекомендует игру <strong>с 6 лет</strong> и считает её подходящей широкой аудитории. Магазины получают региональные рейтинги отдельно.</p>"],
            ["6. Реклама, аналитика и третьи стороны", "<p>В текущей версии нет рекламы и сторонних SDK для аналитики, отслеживания, отчётов об ошибках, облачных сохранений, соцсетей или покупок. Google Play Games — единственная необязательная онлайн-интеграция, регулируемая политиками Google. Google Play также может отдельно обрабатывать данные магазина и устройства.</p>"],
            ["7. Хранение, безопасность и удаление", "<p>Локальные настройки и статистика остаются до удаления. Очистите хранилище приложения в Android или удалите приложение. Запрос на сервер не нужен, поскольку данные не отправляются BieMTech.</p>"],

          ]

            ["7. Saklama, güvenlik ve silme", "<p>Yerel ayar ve istatistikler silinene kadar cihazda kalır. Android'de uygulama depolamasını temizleyin veya uygulamayı kaldırın. BieMTech'e veri gönderilmediği için sunucu silme talebi gerekmez.</p>"],

          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }

      function switchLang(lang) {
        if (!T[lang]) lang = "en";
        try { localStorage.setItem("site_lang", lang); } catch (_) {}
        document.getElementById("lang-select").value = lang;
        render(lang);
      }

      (function initLanguage() {
        let saved = "";
        try { saved = localStorage.getItem("site_lang") || ""; } catch (_) {}
        const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
        const lang = T[saved] ? saved : T[browserLang] ? browserLang : "en";
        document.getElementById("lang-select").value = lang;
        render(lang);
      })();
    </script>
  </body>
</html>
