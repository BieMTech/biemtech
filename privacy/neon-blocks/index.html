            ["6. Conservación y eliminación", "<p>Los ajustes, el progreso y las estadísticas locales permanecen en el dispositivo hasta que los elimines. Puedes borrar todos los datos locales limpiando el almacenamiento de Neon Blocks en los ajustes de Android o desinstalando la app. No hace falta solicitar un borrado del servidor porque el juego no envía datos a ninguno.</p>"],
            ["7. Cambios en esta política", "<p>Podemos actualizar esta política si cambian la aplicación o sus prácticas de datos. La revisión y una nueva fecha aparecerán aquí antes de publicar la versión correspondiente.</p>"],
            ["8. Contacto", "<p>Para preguntas sobre esta política o las prácticas de datos de Neon Blocks, contacta con BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]

        ar: {
          dir: "rtl", back: "سياسات خصوصية BieMTech ←", subtitle: "سياسة الخصوصية", audience: "موصى بها لعمر 6 سنوات فأكثر · مناسبة لجميع الأعمار", rights: "جميع الحقوق محفوظة.", app: "التطبيق", pkg: "الحزمة", updated: "آخر تحديث", date: "9 سبتمبر 2026",
          summary: "<strong>باختصار:</strong> لا تقوم Neon Blocks <strong>بجمع المعلومات الشخصية أو مشاركتها أو بيعها أو إرسالها</strong>. تعمل اللعبة دون اتصال، ولا تحتوي إعلانات أو تحليلات، وتحفظ التقدم على جهازك فقط.",
          sections: [
            ["1. عن هذا التطبيق", "<p>Neon Blocks لعبة ألغاز كتل 8×8 بأوضاع كلاسيكي وجاذبية وسباق. يضع اللاعب الأشكال ويكمل الصفوف والأعمدة ويصنع الشلالات ويتابع النتائج.</p><p>هي لعبة للجمهور العام موصى بها لمن يبلغون <strong>6 سنوات فأكثر</strong> وليست مصممة للأطفال حصراً.</p>"],
            ["2. المعلومات التي نجمعها", "<p>لا تجمع Neon Blocks معلومات شخصية ولا تطلب اسماً أو بريداً أو هاتفاً أو حساباً أو تسجيل دخول، ولا ترسل بيانات اللعب أو الجهاز إلى BieMTech أو طرف ثالث.</p><p>تُحفظ محلياً فقط إعدادات الصوت والموسيقى والاهتزاز والتوهج وإمكانية الوصول واللغة؛ أفضل النتائج والجولات المتوقفة للأوضاع الثلاثة؛ وإحصاءات اللعب والكتل والخطوط والسلاسل والوقت.</p>"],
            ["3. الأطفال والجمهور العام", "<p>تلائم Neon Blocks جمهوراً واسعاً من عمر 6 سنوات فأكثر دون حد أعلى للعمر. لا يوجد تسجيل أو دردشة أو ملف اجتماعي أو محتوى مستخدم أو تنميط سلوكي أو إعلانات موجهة. لا نجمع عمداً معلومات شخصية من الأطفال أو البالغين.</p>"],
            ["4. الاستخدام دون اتصال والأذونات", "<p>تعمل نسخة Android الحالية دون اتصال و<strong>لا تطلب الوصول إلى الإنترنت</strong>. تطلب إذن الاهتزاز فقط للاستجابة اللمسية الاختيارية. ولا تطلب الموقع أو الكاميرا أو الميكروفون أو جهات الاتصال أو الصور أو الوسائط أو التخزين الخارجي أو الإشعارات أو أذونات حساسة أخرى.</p>"],
            ["5. الإعلانات وخدمات الأطراف الثالثة", "<p>لا تحتوي Neon Blocks إعلانات ولا تدمج حِزماً خارجية للتحليلات أو التتبع أو تقارير الأعطال أو الحسابات أو الحفظ السحابي أو الوظائف الاجتماعية. قد تعالج المتاجر أو المنصات التي توفر اللعبة بياناتها وفق سياساتها، وذلك منفصل عن Neon Blocks.</p>"],
            ["6. الاحتفاظ بالبيانات وحذفها", "<p>تبقى الإعدادات والتقدم والإحصاءات المحلية على جهازك حتى تحذفها. يمكنك إزالة جميع البيانات المحلية بمسح مساحة تخزين Neon Blocks من إعدادات Android أو بإلغاء تثبيت التطبيق. لا حاجة لطلب حذف من خادم لأن اللعبة لا ترسل بياناتك إلى خادم.</p>"],
            ["7. تغييرات هذه السياسة", "<p>قد نحدّث هذه السياسة إذا تغير التطبيق أو أسلوب تعامله مع البيانات. سيظهر التعديل وتاريخ جديد هنا قبل إصدار النسخة المعنية.</p>"],
            ["8. تواصل معنا", "<p>للاستفسار عن هذه السياسة أو ممارسات بيانات Neon Blocks، تواصل مع BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]

        pt: {
          dir: "ltr", back: "← Políticas de Privacidade BieMTech", subtitle: "Política de Privacidade", audience: "Recomendado a partir de 6 anos · Adequado para todas as idades", rights: "Todos os direitos reservados.", app: "Aplicativo", pkg: "Pacote", updated: "Última atualização", date: "9 de setembro de 2026",
          summary: "<strong>Em resumo:</strong> Neon Blocks <strong>não coleta, compartilha, vende nem transmite</strong> informações pessoais. O jogo funciona offline, não contém anúncios ou análises e guarda o progresso somente no seu dispositivo.",
          sections: [
            ["1. Sobre este aplicativo", "<p>Neon Blocks é um quebra-cabeça 8×8 com modos Clássico, Gravidade e Corrida. O jogador posiciona formas, completa linhas e colunas, cria cascatas, busca recordes e acompanha resultados.</p><p>É um jogo para o público geral, recomendado para pessoas de <strong>6 anos ou mais</strong>. Não foi criado exclusivamente para crianças.</p>"],
            ["2. Informações que coletamos", "<p>Neon Blocks <strong>não coleta</strong> informações pessoais e não pede nome, e-mail, telefone, conta ou login. Não transmite dados do jogo ou aparelho para a BieMTech nem terceiros.</p><p>Guarda apenas localmente ajustes de som, música, vibração, brilho, acessibilidade e idioma; recordes e partidas pausadas dos três modos; e estatísticas de partidas, blocos, linhas, combos, cascatas e tempo total.</p>"],
            ["3. Crianças e público geral", "<p>Neon Blocks é adequado para um público amplo a partir de 6 anos, sem limite máximo. Não há cadastro, chat, perfil social, conteúdo de usuário, perfil comportamental ou publicidade direcionada. Não coletamos intencionalmente informações pessoais de crianças ou adultos.</p>"],
            ["4. Uso offline e permissões", "<p>A versão atual para Android funciona offline e <strong>não solicita acesso à Internet</strong>. Pede apenas a permissão de vibração para resposta tátil opcional. Não solicita localização, câmera, microfone, contatos, fotos, mídia, armazenamento externo, notificações ou outras permissões sensíveis.</p>"],
            ["5. Publicidade e serviços de terceiros", "<p>Neon Blocks não contém publicidade nem integra SDKs de terceiros para análises, rastreamento, falhas, contas, salvamento em nuvem ou recursos sociais. A loja ou plataforma usada para obter o jogo pode processar dados próprios sob sua política; esse processamento é separado.</p>"],
            ["6. Retenção e exclusão", "<p>Configurações, progresso e estatísticas locais permanecem no dispositivo até você apagá-los. É possível remover todos os dados locais limpando o armazenamento de Neon Blocks nas configurações do Android ou desinstalando o app. Não é preciso pedir exclusão em servidor, pois o jogo não envia dados a nenhum.</p>"],
            ["7. Alterações desta política", "<p>Podemos atualizar esta política se o aplicativo ou suas práticas de dados mudarem. A revisão e uma nova data aparecerão aqui antes do lançamento da versão relevante.</p>"],
            ["8. Contato", "<p>Para dúvidas sobre esta política ou as práticas de dados de Neon Blocks, fale com a BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        ru: {
          dir: "ltr", back: "← Политики конфиденциальности BieMTech", subtitle: "Политика конфиденциальности", audience: "Рекомендуется от 6 лет · Подходит для всех возрастов", rights: "Все права защищены.", app: "Приложение", pkg: "Пакет", updated: "Последнее обновление", date: "9 сентября 2026 г.",
          summary: "<strong>Кратко:</strong> Neon Blocks <strong>не собирает, не передаёт, не продаёт и не отправляет</strong> личную информацию. Игра работает офлайн, не содержит рекламы и аналитики и хранит прогресс только на вашем устройстве.",
          sections: [
            ["1. О приложении", "<p>Neon Blocks — головоломка 8×8 с режимами Классика, Гравитация и Спринт. Игрок размещает фигуры, заполняет строки и столбцы, создаёт каскады и следит за результатами.</p><p>Игра рассчитана на широкую аудиторию и рекомендована игрокам <strong>от 6 лет</strong>. Она не предназначена исключительно для детей.</p>"],
            ["2. Какие данные мы собираем", "<p>Neon Blocks <strong>не собирает</strong> личную информацию и не запрашивает имя, почту, телефон, аккаунт или вход. Данные игры и устройства не отправляются BieMTech или третьим лицам.</p><p>Локально хранятся только настройки звука, музыки, вибрации, свечения, доступности и языка; рекорды и приостановленные партии трёх режимов; статистика игр, блоков, линий, комбо, каскадов и времени.</p>"],
            ["3. Дети и широкая аудитория", "<p>Neon Blocks подходит широкой аудитории от 6 лет без верхнего возрастного ограничения. В игре нет регистрации, чата, соцпрофилей, пользовательского контента, поведенческого профилирования или целевой рекламы. Мы сознательно не собираем личную информацию детей или взрослых.</p>"],
            ["4. Офлайн-режим и разрешения", "<p>Текущая версия Android работает офлайн и <strong>не запрашивает доступ к Интернету</strong>. Требуется только разрешение на вибрацию для необязательной тактильной отдачи. Доступ к местоположению, камере, микрофону, контактам, фото, медиа, внешнему хранилищу, уведомлениям и другим чувствительным функциям не запрашивается.</p>"],
            ["5. Реклама и сторонние сервисы", "<p>Neon Blocks не содержит рекламы и сторонних SDK для аналитики, отслеживания, отчётов о сбоях, аккаунтов, облачных сохранений или социальных функций. Магазин или платформа, где получена игра, может обрабатывать собственные данные по своей политике; это отдельно от Neon Blocks.</p>"],
            ["6. Хранение и удаление", "<p>Локальные настройки, прогресс и статистика остаются на устройстве, пока вы их не удалите. Все данные можно убрать, очистив хранилище Neon Blocks в настройках Android или удалив приложение. Запрос на удаление с сервера не нужен, потому что игра не отправляет данные на сервер.</p>"],
            ["7. Изменения политики", "<p>Мы можем обновить эту политику при изменении приложения или его работы с данными. Новая редакция и дата появятся здесь до выхода соответствующей версии.</p>"],
            ["8. Контакты", "<p>По вопросам этой политики или обработки данных Neon Blocks свяжитесь с BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]

        ja: {
          dir: "ltr", back: "← BieMTech プライバシーポリシー", subtitle: "プライバシーポリシー", audience: "6歳以上推奨 · 全年齢に適しています", rights: "無断転載を禁じます。", app: "アプリ", pkg: "パッケージ", updated: "最終更新日", date: "2026年9月9日",
          summary: "<strong>要約：</strong>Neon Blocksは個人情報を<strong>収集、共有、販売、送信しません</strong>。ゲームはオフラインで動作し、広告や分析機能を含まず、進行状況は端末内だけに保存されます。",
          sections: [
            ["1. このアプリについて", "<p>Neon Blocksはクラシック、重力、ラッシュの各モードを備えた8×8ブロックパズルです。ピースを配置し、行や列を完成させ、連鎖を作り、記録を確認します。</p><p><strong>6歳以上</strong>の一般向けゲームで、子どもだけを対象にしたものではありません。</p>"],
            ["2. 収集する情報", "<p>Neon Blocksは個人情報を<strong>収集せず</strong>、氏名、メール、電話、アカウント、ログインを求めません。ゲームや端末データはBieMTechまたは第三者に送信されません。</p><p>端末内には音、音楽、振動、光、アクセシビリティ、言語設定、3モードの最高得点と一時停止中のゲーム、プレイ・ブロック・ライン・コンボ・連鎖・時間の統計だけが保存されます。</p>"],
            ["3. 子どもと一般の利用者", "<p>Neon Blocksは上限年齢なく6歳以上の幅広い利用者に適しています。登録、チャット、ソーシャルプロフィール、ユーザー生成コンテンツ、行動プロファイリング、ターゲティング広告はありません。子どもまたは大人の個人情報を意図的に収集しません。</p>"],
            ["4. オフライン利用と権限", "<p>現在のAndroid版はオフラインで動作し、<strong>インターネット接続を要求しません</strong>。任意の触覚フィードバック用に振動権限だけを使用します。位置情報、カメラ、マイク、連絡先、写真、メディア、外部ストレージ、通知などの機密権限は要求しません。</p>"],
            ["5. 広告と第三者サービス", "<p>Neon Blocksには広告がなく、分析、追跡、クラッシュ報告、アカウント、クラウド保存、ソーシャル機能用の第三者SDKもありません。ゲームを取得したストアやプラットフォームは独自の方針でデータを扱う場合がありますが、Neon Blocksとは別の処理です。</p>"],
            ["6. 保持と削除", "<p>ローカルの設定、進行、統計は削除するまで端末に残ります。Android設定でNeon Blocksのストレージを消去するか、アプリをアンインストールすると全ローカルデータを削除できます。サーバーに送信しないため、サーバー側の削除依頼は不要です。</p>"],
            ["7. ポリシーの変更", "<p>アプリまたはデータの扱いが変わる場合、本ポリシーを更新することがあります。該当バージョンの公開前に改訂内容と新しい日付をこのページに掲載します。</p>"],
            ["8. お問い合わせ", "<p>本ポリシーまたはNeon Blocksのデータ取り扱いについては、BieMTechまでお問い合わせください：</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]

        de: {
          dir: "ltr", back: "← BieMTech Datenschutzerklärungen", subtitle: "Datenschutzerklärung", audience: "Empfohlen ab 6 Jahren · Für jedes Alter geeignet", rights: "Alle Rechte vorbehalten.", app: "Anwendung", pkg: "Paket", updated: "Zuletzt aktualisiert", date: "9. September 2026",
          summary: "<strong>Kurz gesagt:</strong> Neon Blocks <strong>erfasst, teilt, verkauft oder überträgt keine</strong> personenbezogenen Daten. Das Spiel funktioniert offline, enthält keine Werbung oder Analyse und speichert Fortschritt nur auf deinem Gerät.",
          sections: [
            ["1. Über diese App", "<p>Neon Blocks ist ein 8×8-Blockpuzzle mit Klassik-, Schwerkraft- und Tempo-Modus. Spieler setzen Formen, vervollständigen Reihen und Spalten, bilden Kaskaden und verfolgen Ergebnisse.</p><p>Es ist ein Spiel für die Allgemeinheit und wird <strong>ab 6 Jahren</strong> empfohlen. Es ist nicht ausschließlich für Kinder bestimmt.</p>"],
            ["2. Welche Daten wir erfassen", "<p>Neon Blocks <strong>erfasst keine</strong> personenbezogenen Daten und fragt nicht nach Name, E-Mail, Telefon, Konto oder Anmeldung. Spiel- und Gerätedaten werden nicht an BieMTech oder Dritte übertragen.</p><p>Nur lokal bleiben Ton-, Musik-, Vibrations-, Leucht-, Barrierefreiheits- und Spracheinstellungen; Bestwerte und pausierte Spiele der drei Modi; sowie Statistiken zu Spielen, Blöcken, Linien, Kombos, Kaskaden und Zeit.</p>"],
            ["3. Kinder und allgemeine Zielgruppe", "<p>Neon Blocks eignet sich ohne obere Altersgrenze für ein breites Publikum ab 6 Jahren. Es gibt keine Registrierung, Chats, sozialen Profile, Nutzerinhalte, Verhaltensprofile oder gezielte Werbung. Wir erfassen wissentlich keine persönlichen Daten von Kindern oder Erwachsenen.</p>"],
            ["4. Offline-Nutzung und Berechtigungen", "<p>Die aktuelle Android-Version funktioniert offline und <strong>fordert keinen Internetzugriff an</strong>. Sie nutzt nur die Vibrationsberechtigung für optionales haptisches Feedback. Standort, Kamera, Mikrofon, Kontakte, Fotos, Medien, externer Speicher, Benachrichtigungen oder andere sensible Berechtigungen werden nicht angefordert.</p>"],
            ["5. Werbung und Drittanbieter", "<p>Neon Blocks enthält keine Werbung und keine Drittanbieter-SDKs für Analyse, Tracking, Absturzberichte, Konten, Cloud-Speicher oder soziale Funktionen. Der Store oder die Plattform, über die du das Spiel beziehst, kann eigene Daten nach eigener Richtlinie verarbeiten; dies geschieht getrennt von Neon Blocks.</p>"],
            ["6. Aufbewahrung und Löschung", "<p>Lokale Einstellungen, Fortschritt und Statistiken bleiben auf dem Gerät, bis du sie löschst. Alle lokalen Daten lassen sich durch Löschen des Snake-3D-Speichers in den Android-Einstellungen oder durch Deinstallation entfernen. Eine serverseitige Löschanfrage ist nicht nötig, da das Spiel keine Daten an einen Server sendet.</p>"],
            ["7. Änderungen", "<p>Wir können diese Richtlinie aktualisieren, wenn sich die App oder ihre Datenverarbeitung ändert. Die Überarbeitung und ein neues Datum erscheinen hier vor Veröffentlichung der betreffenden Version.</p>"],
            ["8. Kontakt", "<p>Bei Fragen zu dieser Richtlinie oder zur Datenverarbeitung von Neon Blocks kontaktiere BieMTech:</p><a class=\"contact-link\" href=\"mailto:info@biemtech.com\">info@biemtech.com</a>"]
          ]
        },
        fr: {
          dir: "ltr", back: "← Politiques de confidentialité BieMTech", subtitle: "Politique de confidentialité", audience: "Recommandé dès 6 ans · Adapté à tous les âges", rights: "Tous droits réservés.", app: "Application", pkg: "Package", updated: "Dernière mise à jour", date: "9 septembre 2026",
          summary: "<strong>En bref :</strong> Neon Blocks <strong>ne collecte, ne partage, ne vend et ne transmet</strong> aucune information personnelle. Le jeu fonctionne hors ligne, sans publicité ni analyse, et conserve la progression uniquement sur votre appareil.",
          sections: [
            ["1. À propos de l'application", "<p>Neon Blocks est un puzzle de blocs 8×8 avec les modes Classique, Gravité et Chrono. Le joueur place des formes, complète lignes et colonnes, crée des cascades et suit ses résultats.</p><p>C'est un jeu grand public recommandé aux personnes de <strong>6 ans et plus</strong>. Il n'est pas conçu exclusivement pour les enfants.</p>"],
            ["2. Informations collectées", "<p>Neon Blocks <strong>ne collecte aucune</strong> information personnelle et ne demande ni nom, e-mail, téléphone, compte ou connexion. Les données de jeu et de l'appareil ne sont transmises ni à BieMTech ni à des tiers.</p><p>Restent uniquement sur l'appareil les réglages de son, musique, vibration, lueur, accessibilité et langue ; records et parties en pause des trois modes ; statistiques de parties, blocs, lignes, combos, cascades et temps.</p>"],
            ["3. Enfants et grand public", "<p>Neon Blocks convient à un large public dès 6 ans, sans limite supérieure. Il n'y a ni inscription, ni chat, ni profil social, ni contenu utilisateur, ni profilage comportemental, ni publicité ciblée. Nous ne collectons sciemment aucune donnée personnelle d'enfants ou d'adultes.</p>"],
            ["4. Utilisation hors ligne et autorisations", "<p>La version Android actuelle fonctionne hors ligne et <strong>ne demande pas l'accès à Internet</strong>. Elle utilise uniquement l'autorisation de vibration pour le retour haptique facultatif. Elle ne demande pas la localisation, la caméra, le microphone, les contacts, les photos, les médias, le stockage externe, les notifications ou d'autres autorisations sensibles.</p>"],
            ["5. Publicité et services tiers", "<p>Neon Blocks ne contient aucune publicité et aucun SDK tiers d'analyse, suivi, rapport de plantage, compte, sauvegarde cloud ou fonction sociale. Le magasin ou la plateforme ayant fourni le jeu peut traiter ses propres données selon sa politique ; ce traitement est distinct de Neon Blocks.</p>"],

      function render(lang) {
        const t = T[lang] || T.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.querySelector('[data-i18n="back"]').textContent = t.back;
        document.querySelector('[data-i18n="subtitle"]').textContent = t.subtitle;
        document.querySelector('[data-i18n="audience"]').textContent = t.audience;
        document.querySelector('[data-i18n="rights"]').textContent = t.rights;
        document.getElementById("policy-content").innerHTML = `
          <p class="meta">
            ${t.app}: <strong>Neon Blocks</strong> &nbsp;|&nbsp;
            ${t.pkg}: <code>com.biemtech.neonblocks</code> &nbsp;|&nbsp;
            ${t.updated}: <strong>${t.date}</strong>
          </p>
          <div class="summary">✓ ${t.summary}</div>
          ${t.sections.map(([title, body]) => `<section class="card"><h2>${title}</h2>${body}</section>`).join("")}
        `;
      }

      function switchLang(lang) {
        render(lang);
        try { localStorage.setItem("site_lang", lang); } catch (_) {}
      }

      (function initLanguage() {
        let saved = "";
        try { saved = localStorage.getItem("site_lang") || ""; } catch (_) {}
        const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
        const lang = T[saved] ? saved : T[browserLang] ? browserLang : "en";
        document.getElementById("lang-select").value = lang;
        render(lang);
      })();
    </script>
