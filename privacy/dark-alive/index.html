<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#100d18" />
    <meta name="description" content="Privacy Policy for Dark Alive (Wallpaper Alive) by BieMTech." />
    <title>Dark Alive Privacy Policy | BieMTech</title>
    <link rel="icon" type="image/png" href="../../img/favicon.png" />
    <style>
      :root { color-scheme: dark; --bg: #100d18; --card: #1b1527; --text: #f2edf7; --muted: #d0c6dc; --accent: #d2b1ff; --border: #493a58; }
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { min-height: 100vh; margin: 0; color: var(--text); background: radial-gradient(circle at 80% 4%, #342044, transparent 34rem), var(--bg); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
      a { color: var(--accent); }
      .topbar, header, main { width: min(850px, calc(100% - 36px)); margin-inline: auto; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding-top: 24px; }
      .back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 650; }
      .back img { width: 28px; height: 28px; border-radius: 6px; }
      select { max-width: 150px; padding: 9px 12px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: .86rem; cursor: pointer; }
      header { padding: 46px 0 34px; text-align: center; }
      .app-icon { display: block; width: 104px; height: 104px; margin: 0 auto 18px; border: 1px solid #65425b; border-radius: 24px; object-fit: cover; box-shadow: 0 18px 42px #0008, 0 0 35px #e22b4929; }
      .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: .78rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.08; letter-spacing: -.04em; }
      .subtitle { margin: 14px 0 0; color: var(--muted); }
      main { padding-bottom: 62px; }
      .meta, .summary, .card { border: 1px solid var(--border); border-radius: 16px; background: var(--card); }
      .meta { padding: 13px 17px; color: var(--muted); font-size: .84rem; text-align: center; overflow-wrap: anywhere; }
      .summary { margin: 16px 0; padding: 18px 21px; border-color: #735592; background: #281c38; }
      .card { margin-top: 14px; padding: 23px 25px; }
      h2 { margin: 0 0 9px; color: var(--accent); font-size: 1.1rem; line-height: 1.35; }
      .card p { margin: 0; color: var(--muted); }
      .contact { font-weight: 700; overflow-wrap: anywhere; }
      footer { padding: 25px 18px; border-top: 1px solid var(--border); color: #aa9db7; text-align: center; font-size: .84rem; }
      [dir="rtl"] .card, [dir="rtl"] .summary { text-align: right; }
      @media (max-width: 560px) { .topbar { align-items: flex-start; } .back { max-width: 180px; } header { padding-top: 32px; } .card { padding: 20px; } .meta { text-align: start; } }
    </style>
  </head>
  <body>
    <div class="topbar">
      <a class="back" href="../index.html"><img src="../../img/logo-biemtech.png" alt="" /><span id="back-label">← BieMTech Privacy Policies</span></a>
      <select id="language" aria-label="Language">
        <option value="en">🇬🇧 English</option>
        <option value="az">🇦🇿 Azərbaycan dili</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
      </select>
    </div>
    <header>
      <img class="app-icon" src="../../img/dark-alive-icon.png" alt="Dark Alive app icon" width="104" height="104" />
      <p class="eyebrow" id="policy-label">Privacy Policy</p>
      <h1>Dark Alive</h1>
      <p class="subtitle" id="subtitle">Wallpaper Alive · Android live wallpapers</p>
    </header>
    <main id="policy-content"></main>
    <footer>© <span id="year">2026</span> BieMTech · <span id="rights">All rights reserved.</span></footer>
    <script src="policy-i18n.js"></script>
    <script>
      function render(lang) {
        const t = DARK_ALIVE_POLICY[lang] || DARK_ALIVE_POLICY.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir || "ltr";
        document.title = `Dark Alive ${t.policy} | BieMTech`;
        document.getElementById("back-label").textContent = t.back;
        document.getElementById("policy-label").textContent = t.policy;
        document.getElementById("subtitle").textContent = t.subtitle;
        document.getElementById("rights").textContent = t.rights;
        const main = document.getElementById("policy-content");
        main.replaceChildren();
        const meta = document.createElement("p");
        meta.className = "meta";
        meta.textContent = `${t.developer}: BieMTech · ${t.app}: Dark Alive (Wallpaper Alive) · ${t.package}: com.biemtech.wallpaper_alive · ${t.updated}: ${t.date}`;
        main.append(meta);
        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = t.summary;
        main.append(summary);
        for (const [heading, body] of t.sections) {
          const section = document.createElement("section");
          section.className = "card";
          const h2 = document.createElement("h2");
          h2.textContent = heading;
          const p = document.createElement("p");
          p.textContent = body;
          section.append(h2, p);
          main.append(section);
        }
        const contact = document.createElement("section");
        contact.className = "card";
        const h2 = document.createElement("h2");
        h2.textContent = t.contact;
        const p = document.createElement("p");
        p.textContent = t.contactText + " ";
        const a = document.createElement("a");
        a.className = "contact";
        a.href = "mailto:info@biemtech.com";
        a.textContent = "info@biemtech.com";
        p.append(a);
        contact.append(h2, p);
        main.append(contact);
      }
      const selector = document.getElementById("language");
      selector.addEventListener("change", () => {
        const lang = selector.value;
        try { localStorage.setItem("biemtech-lang", lang); } catch (_) {}
        render(lang);
      });
      document.getElementById("year").textContent = new Date().getFullYear();
      let saved = "";
      try { saved = localStorage.getItem("biemtech-lang") || ""; } catch (_) {}
      const browserLang = (navigator.language || "en").slice(0, 2).toLowerCase();
      const initial = DARK_ALIVE_POLICY[saved] ? saved : DARK_ALIVE_POLICY[browserLang] ? browserLang : "en";
      selector.value = initial;
      render(initial);
    </script>
  </body>
</html>
